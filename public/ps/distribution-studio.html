<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distribution Studio — Insurance Product Studio</title>
  <meta name="description" content="Control which distribution channels may offer this product, define channel-specific rules, and manage intermediary access.">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/studio-hub.css">
  <style>
    /* ── Two-panel layout ──────────────────────── */
    .studio-layout { display: grid; grid-template-columns: 320px 1fr; gap: var(--space-5); align-items: start; }

    /* ── Channel list sidebar ──────────────────── */
    .channel-sidebar { position: sticky; top: calc(56px + var(--space-6)); }
    .channel-list { display: flex; flex-direction: column; gap: 2px; padding: var(--space-2); }
    .channel-item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: 10px var(--space-4);
      border-radius: var(--radius-md); cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .1s, border-color .1s;
    }
    .channel-item:hover { background: var(--color-surface); }
    .channel-item.active { background: var(--color-brand-light); border-left-color: var(--color-brand); }
    .channel-icon { font-size: 16px; flex-shrink: 0; }
    
    .channel-item-body { flex: 1; min-width: 0; }
    .channel-item-name { font-size: 13px; font-weight: 500; color: var(--color-ink); }
    .channel-item.active .channel-item-name { color: var(--color-brand); }
    .channel-item-meta { font-size: 11px; color: var(--color-muted); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
    
    .channel-comm-badge {
      display: inline-flex; height: 18px; padding: 0 6px; border-radius: 4px;
      font-size: 10px; font-weight: 700; align-items: center;
      background: var(--color-brand-light); color: var(--color-brand); flex-shrink: 0;
    }
    .channel-status-icon { flex-shrink: 0; font-size: 12px; }
    .channel-status-active { color: var(--color-success); }
    .channel-status-inactive { color: var(--color-muted); }

    /* ── Section card ──────────────────────────── */
    .section-card { background: var(--color-panel); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); cursor: pointer; user-select: none; transition: background .1s; }
    .section-header:hover { background: var(--color-surface); }
    .section-header-left { display: flex; align-items: center; gap: var(--space-3); }
    .section-number { width: 24px; height: 24px; border-radius: 50%; background: var(--color-brand-light); color: var(--color-brand); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .section-title { font-size: 14px; font-weight: 600; }
    .section-subtitle { font-size: 12px; color: var(--color-muted); margin-top: 1px; }
    .section-chevron { color: var(--color-muted); transition: transform .2s; }
    .section-chevron.open { transform: rotate(90deg); }
    .section-body { border-top: 1px solid var(--color-border); max-height: 0; overflow: hidden; transition: max-height .3s ease; }
    .section-body.open { max-height: 2000px; overflow: visible; }
    .section-inner { padding: var(--space-5) var(--space-6); }

    /* ── Form grids ────────────────────────────── */
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-6); }
    .span-2 { grid-column: 1 / -1; }

    /* ── Toggle ────────────────────────────────── */
    .toggle-wrap { display: flex; align-items: center; gap: var(--space-3); font-size: 13px; }
    .toggle-switch { position: relative; width: 40px; height: 22px; display: inline-block; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; border-radius: 11px; cursor: pointer; transition: .2s; }
    .toggle-on  .toggle-slider { background: var(--color-brand); }
    .toggle-off .toggle-slider { background: var(--color-disabled); }
    .toggle-dot { position: absolute; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle-on  .toggle-dot { left: calc(100% - 20px); }
    .toggle-off .toggle-dot { left: 2px; }

    /* ── Data Tables ───────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th { text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--color-muted); border-bottom: 1px solid var(--color-border); background: var(--color-surface); }
    .data-table td { padding: 10px 12px; border-bottom: 1px solid var(--color-border); }
    .data-table tr:last-child td { border-bottom: none; }
    
    .table-actions { display: flex; gap: var(--space-3); margin-top: var(--space-4); }

    /* ── Context bar ───────────────────────────── */
    .studio-context-bar {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-3) var(--space-5);
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); margin-bottom: var(--space-5); font-size: 13px;
    }
    .studio-context-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; background: var(--color-panel);
      border: 1px solid var(--color-border); border-radius: 100px;
      font-size: 12px; font-weight: 500;
    }
    /* ── Distribution UI safeguards ───────────────── */
    .distribution-page-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
    .distribution-page-actions .btn { white-space:nowrap; }
    .channel-list { max-height:calc(100vh - 300px); overflow-y:auto; }
    .distribution-detail-scroll { min-width:0; overflow-x:auto; }
    @media (max-width: 1200px) {
      .studio-layout { grid-template-columns: 1fr; }
      .channel-sidebar { position:relative; top:auto; }
      .channel-list { max-height:none; }
    }
    @media (max-width: 768px) {
      .page-header { align-items:flex-start; }
      .distribution-page-actions { width:100%; }
    }
  </style>
</head>
<body>

  <main class="main-content" id="main-content">
    <div class="page-inner">

            Commission Summary
          </button>
          <button class="btn btn-primary" onclick="openAddChannelModal()">
            <svg width="16" height="16" viewBox="0 0 256 256" fill="none"><path d="M224 128a8 8 0 01-8 8h-80v80a8 8 0 01-16 0v-80H40a8 8 0 010-16h80V40a8 8 0 0116 0v80h80a8 8 0 018 8z" fill="currentColor"/></svg>

        </div>
      </div>

      <div id="studio-library-root" class="hidden"></div>
      <div id="studio-product-workspace">
      <div class="studio-context-bar">
        <span id="ctx-count"></span>
        <div style="margin-left:auto"><a id="ctx-back-link" href="product-detail.html" class="btn btn-ghost btn-sm">← Back to Product</a></div>

          <button class="btn btn-ghost btn-sm" type="button" onclick="PS.studioHub.back()">← Back to channels</button>
        </div>
      <div class="studio-layout">
        <!-- LEFT: Channel List -->
        <div class="channel-sidebar">
          <div class="card">
            <div class="card-header" style="padding:var(--space-4) var(--space-5)">
              <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--color-muted)">Distribution Channels</div>
            </div>
            <div class="channel-list" id="channel-list"></div>

        </div>

        <!-- RIGHT: Detail Panel -->

<script>
/* Channel ID format:
   Carrier Short Name - LOB - Product Short Name - State(s)
   Example: Southlake Homes / ST + Commercial Auto / CA +
            Commercial Trucking Auto / CTA + TX,CA
            => ST-CA-CTA-TX,CA

   These values are read from the channel record so the ID is generated,
   not manually maintained. Supported fields:
   carrierShort, lobShort, productShort, states[]
*/
function cleanChannelIdPart(value) {
  return String(value || '')
    .trim()
    .toUpperCase()
    .replace(/[^A-Z0-9]+/g, '');
}

function normalizeStateCodes(states) {
  const list = Array.isArray(states)
    ? states
    : String(states || '').split(',');
  return [...new Set(list
    .map(cleanChannelIdPart)
    .filter(Boolean))];
}

function buildChannelId(channel) {
  if (!channel) return '';

  const carrierShort = cleanChannelIdPart(
    channel.carrierShort || channel.carrier?.shortName || channel.carrier?.short || channel.carrierCode
  );
  const lobShort = cleanChannelIdPart(
    channel.lobShort || channel.lob?.shortName || channel.lob?.short || channel.lobCode
  );
  const productShort = cleanChannelIdPart(
    channel.productShort || channel.product?.shortName || channel.product?.short || channel.productCode
  );
  const states = normalizeStateCodes(
    channel.states || channel.stateCodes || channel.territorialStates ||
    (Array.isArray(channel.territories) ? channel.territories.map(t => t.code || t.state || t.j) : [])
  );

  if (carrierShort && lobShort && productShort && states.length) {
    return `${carrierShort}-${lobShort}-${productShort}-${states.join(',')}`;
  }

  // Do not invent an ID when the required product context is unavailable.
  return channel.id || '';
}

function applyGeneratedChannelIds() {
  CHANNELS.forEach(channel => {
    const generatedId = buildChannelId(channel);
    if (generatedId) channel.id = generatedId;
  });
}

const CHANNELS = [
  { id:'CHAN-D01', carrierShort:'ST', lobShort:'CA', productShort:'CTA', states:['TX','CA'], name:'Direct (Web)', icon:'🌐', status:'active', comm:'0%', type:'Direct',
    desc:'Direct-to-consumer sales via the primary public website.',
    auth:'Consumers may quote and buy without referral if standard rules pass.',
    territories:[{j:'India',p:'Yes',n:'All zones'},{j:'UAE',p:'Yes',n:'All zones'},{j:'UK',p:'No',n:'Not launched'}],
    commConfig:{ type:'None', rate:'0%', basis:'0% / 0% / 0%', override:'No', max:'0%', clawback:'N/A', timing:'N/A', code:'COMM-DIR-00' },
    rules:[], accessModel:'Public Access (No intermediaries)', intermediaries:[],
    from:'01-Apr-2026', to:'30-Sep-2026'
  },
  { id:'CHAN-B01', carrierShort:'ST', lobShort:'CA', productShort:'CTA', states:['TX','CA'], name:'Broker Portal', icon:'🤝', status:'active', comm:'15%', type:'Intermediary — Broker',
    desc:'Appointed brokers accessing the product via the broker web portal.',
    auth:'Brokers may quote and bind up to $50,000 sum insured without referral.',
    territories:[{j:'India',p:'Yes',n:'All zones'},{j:'UAE',p:'Yes',n:'Zones A, B only'},{j:'UK',p:'No',n:'Pending regulatory approval'}],
    commConfig:{ type:'Percentage of Gross Premium (excluding taxes)', rate:'15%', basis:'New Business: 15% / Renewal: 12% / Reinstated: 10%', override:'Yes — with Underwriting Manager approval', max:'20%', clawback:'Yes — pro-rata on cancellation within 90 days', timing:'Monthly in arrears', code:'COMM-BROKER-STD' },
    rules:[
      { rule:'Max Insured Value (Broker)', type:'Override', val:'$150,000', note:'Brokers may quote higher SI than direct' },
      { rule:'Minimum Premium (Broker)', type:'Override', val:'$180/year', note:'Slightly lower than direct channel' },
      { rule:'Discount Cap (Broker)', type:'Addition', val:'Max discount: 50%', note:'Brokers may stack up to 50%' },
      { rule:'Payment Methods', type:'Restriction', val:'Annual only', note:'Installments not available via broker portal' }
    ],
    accessModel:'Restricted Access',
    intermediaries:[
      { name:'Asha Brokers Ltd', code:'BRK-001', auth:'Yes', terr:'India', stat:'Active' },
      { name:'Global Risk Partners', code:'BRK-002', auth:'No (quote only)', terr:'UAE', stat:'Active' },
      { name:'Premier Insurance Brokers', code:'BRK-003', auth:'Yes', terr:'India, UAE', stat:'Active' }
    ],
    from:'01-Apr-2026', to:'30-Sep-2026'
  },
  { id:'CHAN-BA01', carrierShort:'ST', lobShort:'CA', productShort:'CTA', states:['TX','CA'], name:'Bancassurance', icon:'🏦', status:'active', comm:'12%', type:'Intermediary — Bank Partner',
    desc:'Integrated sales through partner banking applications.',
    auth:'Automatic binding based on bank customer pre-approval.',
    territories:[{j:'India',p:'Yes',n:'Partner bank branch regions only'}],
    commConfig:{ type:'Percentage of Gross Premium', rate:'12%', basis:'New Business: 12% / Renewal: 10%', override:'No', max:'15%', clawback:'Yes', timing:'Quarterly', code:'COMM-BANK-STD' },
    rules:[], accessModel:'Bank Partners Only', intermediaries:[],
    from:'01-Apr-2026', to:'30-Sep-2026'
  },
  { id:'CHAN-API01', carrierShort:'ST', lobShort:'CA', productShort:'CTA', states:['TX','CA'], name:'API Partner', icon:'{ }', status:'active', comm:'10%', type:'API Integration',
    desc:'Headless distribution via third-party FinTech app.',
    auth:'Quote only — bind via separate API endpoint with OTP verification.',
    territories:[{j:'India',p:'Yes',n:'App user base'}],
    commConfig:{ type:'Percentage of Net Premium', rate:'10%', basis:'Flat 10% on all transactions', override:'No', max:'10%', clawback:'Yes — full refund if cancelled within 14 days', timing:'Monthly', code:'COMM-API-FIN' },
    apiConfig:{
      consumer:'FinTech Partner — InsureNow App',
      key:'sk-••••••••••••3f9a',
      limit:'1000 quotes/hour',
      whiteLabel:'Yes — custom product name: "InsureNow Car Plan"',
      dta:'DTA-2026-INSRNOW-001'
    },
    rules:[
      { rule:'Policy Documentation', type:'Restriction', val:'Digital only', note:'No paper documentation permitted via API' },
      { rule:'Referrals', type:'Restriction', val:'Treated as Decline', note:'Automated accept/decline only. Referrals trigger webhook notification.' }
    ],
    accessModel:'API Key Restricted', intermediaries:[],
    from:'01-Apr-2026', to:'30-Sep-2026'
  }
];

let activeChannelId = 'CHAN-B01';
let openSections = new Set(['mgu-dist','identity','territory','commission','rules','access','effective','api']);

document.addEventListener('DOMContentLoaded', () => {
  applyGeneratedChannelIds();
  PS.studioHub.mount({
    navId: 'distribution',
    studioLabel: 'Distribution Studio',
    collection: 'channels',
    apiField: 'channels',
    persist: 'channels',
    persistTarget: () => CHANNELS,
    getItems: () => CHANNELS,
    applyItems: list => {
      CHANNELS.splice(0, CHANNELS.length, ...list.map(c => Object.assign({}, c, {
        carrierShort: c.carrierShort || c.carrier?.shortName || c.carrierCode || '',
        lobShort: c.lobShort || c.lob?.shortName || c.lobCode || '',
        productShort: c.productShort || c.product?.shortName || c.productCode || '',
        states: normalizeStateCodes(c.states || c.stateCodes || c.territorialStates),
        status: c.status || 'active',
        comm: c.comm || c.commission || '—',
        type: c.type || c.accessModel || 'Channel',
        desc: c.desc || c.description || '',
        icon: c.icon || '•',
        auth: c.auth || c.accessModel || '—',
        territories: c.territories || [],
        commConfig: c.commConfig || { type: '—', rate: c.comm || c.commission || '—', basis: '—', override: 'No', max: '—', clawback: '—', timing: '—', code: '—' },
        rules: c.rules || [],
        intermediaries: c.intermediaries || [],
        from: c.from || '—',
        to: c.to || '—'
      })).map(c => ({ ...c, id: buildChannelId(c) || c.id })));
      if (CHANNELS.length && !CHANNELS.some(c => c.id === activeChannelId)) activeChannelId = CHANNELS[0].id;
      if (!CHANNELS.length) activeChannelId = '';
    },
    getActiveId: () => activeChannelId,
    setActiveId: id => { activeChannelId = id; },
    loadItem: loadChannel,
    renderSidebar: renderSidebar,
    noun: 'channels',
    hubTitle: 'Channels',
    hubSubtitle: 'Manage and configure distribution channels linked to this product',
    addOnclick: 'openAddChannelModal()',
    deepParam: 'channel',
    searchKeys: ['name', 'id', 'type', 'status', 'comm'],
    filters: [
      { value: 'all', label: 'All channels' },
      { value: 'active', label: 'Active' },
      { value: 'inactive', label: 'Inactive' }
    ],
    matchFilter: (item, filter) => {
      if (filter === 'active') return item.status === 'active';
      if (filter === 'inactive') return item.status !== 'active';
      return true;
    },
    stats: items => {
      const active = items.filter(c => c.status === 'active').length;
      const overrides = items.reduce((n, c) => n + (c.rules?.length || 0), 0);
      return [`${items.length} channels`, `${active} active`, `${overrides} rule overrides`];
    },
    isCreated: item => item.status === 'active',
    statusLabel: item => item.status === 'active' ? 'Active' : 'Inactive',
    columns: [
      { header: 'Channel', value: c => c.name, primary: true },
      { header: 'Channel ID', value: c => buildChannelId(c) || c.id, mono: true },
      { header: 'Type', value: c => c.type || '—' },
      { header: 'Commission', value: c => c.comm || '—' },
      { header: 'Access', value: c => c.accessModel || c.auth || '—' },
      { header: 'Status', value: c => c.status, kind: 'status' }
    ]
  });
});

function renderSidebar() {
  const list = document.getElementById('channel-list');
  if (!list) return;
  list.innerHTML = CHANNELS.map(c => {
    const channelId = buildChannelId(c) || c.id;
    return `
    <div class="channel-item ${channelId===activeChannelId?'active':''}" onclick="loadChannel('${channelId}')" id="ch-${channelId}">
      <span class="channel-icon">${c.icon}</span>
      <div class="channel-item-body">
        <div class="channel-item-name">${c.name}</div>
        <div class="channel-item-meta">${c.id}</div>
      </div>
      <span class="channel-comm-badge">${c.comm}</span>
      <span class="channel-status-icon ${c.status==='active'?'channel-status-active':'channel-status-inactive'}" style="margin-left:4px">${c.status==='active'?'✓':'✗'}</span>
    </div>`;
  }).join('');
}

function loadChannel(id) {
  activeChannelId = id;
  document.querySelectorAll('.channel-item').forEach(el=>el.classList.remove('active'));
  document.getElementById(`ch-${id}`)?.classList.add('active');
  const ch = CHANNELS.find(c => (buildChannelId(c) || c.id) === id || c.id === id);
  if (!ch) return;
  renderDetail(ch);
}

function renderDetail(c) {
  const p = document.getElementById('detail-panel');
  const isRiskCarrier = PS.auth.isLoggedIn() && PS.auth.current()?.role === 'risk-carrier';
  
  p.innerHTML = `
    <div style="display:flex;align-items:center;gap:var(--space-4);margin-bottom:var(--space-2)">
      <h2 style="font-size:18px;font-weight:700"><span style="margin-right:8px">${c.icon}</span>${c.name}</h2>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--color-muted);background:var(--color-surface);border:1px solid var(--color-border);border-radius:4px;padding:2px 7px">${buildChannelId(c) || c.id}</span>
      <span class="badge badge-published" style="font-size:10px">ACTIVE</span>
    </div>

    ${isRiskCarrier ? mguDistSection() : ''}

    ${buildSection('identity','1','Channel Identity', c.type, `
      <div class="form-grid-2">
        ${rof('Channel Name', c.name)}
        ${rof('Channel ID', c.id, true)}
        ${rof('Channel Type', c.type)}
        ${rof('Status', c.status==='active'?'Active':'Inactive')}
        <div class="form-group span-2"><label class="form-label">Description</label>
          <div style="font-size:13px;color:var(--color-muted)">${c.desc}</div>
        </div>
        <div class="form-group span-2"><label class="form-label">Quoting Authority</label>
          <div style="font-size:13px;color:var(--color-ink);background:var(--color-surface);padding:8px 12px;border-radius:var(--radius-md);border:1px solid var(--color-border)">${c.auth}</div>
        </div>
      </div>
    `)}

    ${c.apiConfig ? buildSection('api','*','API Integration Settings', 'Authentication and limits', `
      <div class="form-grid-2">
        ${rof('API Consumer', c.apiConfig.consumer)}
        ${rof('API Key', c.apiConfig.key, true)}
        ${rof('Rate Limit', c.apiConfig.limit)}
        ${rof('White-label Settings', c.apiConfig.whiteLabel)}
        ${rof('Data Transfer Agreement', c.apiConfig.dta, true)}
      </div>
    `) : ''}

    ${buildSection('territory','2','Territorial Limits', 'Jurisdictions where channel may operate', `
      <table class="data-table">
        <thead><tr><th>Jurisdiction</th><th>Permitted</th><th>Notes</th></tr></thead>
        <tbody>
          ${c.territories.map(t=>`<tr>
            <td><strong>${t.j}</strong></td>
            <td style="color:${t.p==='Yes'?'var(--color-success)':'var(--color-danger)'}">${t.p==='Yes'?'✓ Yes':'✗ No'}</td>
            <td style="color:var(--color-muted)">${t.n}</td>
          </tr>`).join('')}
        </tbody>
      </table>
      <div class="table-actions"><button class="btn btn-ghost btn-sm" disabled>+ Add Jurisdiction</button></div>
    `)}

    ${buildSection('commission','3','Commission Configuration', `${c.commConfig.rate} standard rate`, `
      <div class="form-grid-2">
        ${rof('Commission Type', c.commConfig.type)}
        <div class="form-group"><label class="form-label">Standard Rate</label>
          <div style="font-size:18px;font-weight:700;color:var(--color-brand);padding:4px 0">${c.commConfig.rate}</div>
        </div>
        <div class="form-group span-2">${rof('Commission Basis', c.commConfig.basis)}</div>
        ${rof('Override Allowed', c.commConfig.override)}
        ${rof('Maximum Commission', c.commConfig.max)}
        ${rof('Commission Claw-back', c.commConfig.clawback)}
        ${rof('Payment Timing', c.commConfig.timing)}
        ${rof('Commission Code', c.commConfig.code, true)}
      </div>
    `)}

    ${buildSection('rules','4','Channel-Specific Rules', `${c.rules.length} overrides/additions`, `
      ${c.rules.length===0 ? `<div style="font-size:13px;color:var(--color-muted);padding:var(--space-3) 0">No channel-specific rules configured. Channel uses standard product rules.</div>` : 
      `<table class="data-table">
        <thead><tr><th>Rule</th><th>Type</th><th>Value</th><th>Note</th></tr></thead>
        <tbody>
          ${c.rules.map(r=>`<tr>
            <td><strong>${r.rule}</strong></td>
            <td><span style="font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--color-surface);border:1px solid var(--color-border)">${r.type}</span></td>
            <td>${r.val}</td>
            <td style="color:var(--color-muted);font-size:12px">${r.note}</td>
          </tr>`).join('')}
        </tbody>
      </table>`}
      <div class="table-actions"><button class="btn btn-ghost btn-sm" disabled>+ Add Rule Override</button></div>
    `)}

    ${buildSection('access','5','Intermediary Access', c.accessModel, `
      <div style="margin-bottom:var(--space-4);display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:13px;font-weight:600">Access Model: ${c.accessModel}</div>
          <div style="font-size:12px;color:var(--color-muted);margin-top:2px">${c.accessModel==='Restricted Access'?'Only the intermediaries listed below may access this channel.':'All appointed intermediaries have access (no individual configuration needed).'}</div>
        </div>
        ${c.accessModel==='Restricted Access' ? `<button class="btn btn-ghost btn-sm">Switch to Open Access</button>` : ''}
      </div>
      
      ${c.intermediaries.length > 0 ? `
        <table class="data-table">
          <thead><tr><th>Intermediary</th><th>Code</th><th>Binding Auth</th><th>Territory</th><th>Status</th></tr></thead>
          <tbody>
            ${c.intermediaries.map(i=>`<tr>
              <td><strong>${i.name}</strong></td>
              <td style="font-family:'IBM Plex Mono',monospace;font-size:12px">${i.code}</td>
              <td>${i.auth}</td>
              <td>${i.terr}</td>
              <td style="color:${i.stat==='Active'?'var(--color-success)':'var(--color-muted)'}">${i.stat}</td>
            </tr>`).join('')}
          </tbody>
        </table>
        <div class="table-actions"><button class="btn btn-ghost btn-sm" disabled>+ Add Intermediary</button></div>
      ` : ''}
    `)}

    ${buildSection('effective','6','Effective Dates', `${c.from} — ${c.to}`, `
      <div class="form-grid-2">
        ${rof('Channel Active From', c.from)}
        ${rof('Channel Active To', c.to)}
      </div>
      <div style="margin-top:var(--space-3)">
        <div class="toggle-wrap">
          <div class="toggle-switch toggle-off"><div class="toggle-slider"></div><div class="toggle-dot"></div></div>
          <span style="font-size:13px;color:var(--color-muted)">Override effective period (use dates different from the product version)</span>
        </div>
      </div>
    `)}
  `;

  openSections.forEach(sid => {
    document.getElementById(`sec-body-${sid}`)?.classList.add('open');
    document.getElementById(`sec-chev-${sid}`)?.classList.add('open');
  });
}

function mguDistSection() {
  const params = new URLSearchParams(location.search);
  const productId = params.get('product') || params.get('id') || PS.prototypeApp.getContext?.().productId || '';
  const prod = productId ? PS.prototypeApp.productById(productId) : null;
  const id = prod?.id || productId || '';
  const name = prod?.name || 'this product';
  if (!prod) {
    return buildSection('mgu-dist', '0', 'MGU Distribution', 'MGUs that can offer this product', `
      <div style="font-size:13px;color:var(--color-muted)">No product context found. Assign products to MGUs from the <a href="mgu-assignment.html">MGU Assignment</a> page.</div>`);
  }
  const mgas = (PS.auth.mgaOrgs() || []).map(o => {
    const entry = (prod.assignedMGAs || []).find(m => m.mgaId === o.id);
    const assigned = entry && entry.status === 'assigned';
    return `
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--color-border)">
        <div>
          <div style="font-size:13px;font-weight:600">${o.org.name}</div>
          <div style="font-size:12px;color:var(--color-muted)">${assigned ? `Assigned · ${entry.assignedAt}` : 'Not assigned'}</div>
        </div>
        <button class="btn btn-sm ${assigned ? 'btn-secondary' : 'btn-primary'}" onclick="mguDistToggle('${id}','${o.id}',${assigned ? 'false' : 'true'})">${assigned ? 'Revoke' : 'Assign'}</button>
      </div>`;
  }).join('');
  return buildSection('mgu-dist', '0', 'MGU Distribution', 'MGUs that can offer this product', `
    <div style="margin-bottom:var(--space-3);font-size:13px;color:var(--color-muted)">
      Assignment controls for <strong>${name}</strong> (${id}). Assigned MGUs can see and configure this product in their studios.
      <a href="mgu-assignment.html?id=${id}" style="font-size:12px;margin-left:8px">Open full MGU Assignment →</a>
    </div>
    ${mgas}`);
}

function mguDistToggle(productId, mgaId, active) {
  const res = PS.prototypeApp.assignProductToMGA(productId, mgaId, active);
  if (!res.ok) { PS.actionResult('error', 'Could not update assignment', res.error || 'Unknown error'); return; }
  const mga = (PS.auth.ORGS[mgaId] || {}).name || mgaId;
  PS.actionResult(active ? 'success' : 'warning', active ? 'Product assigned to MGU' : 'MGU assignment revoked', `${mga}`);
  const ch = CHANNELS.find(c => (buildChannelId(c) || c.id) === activeChannelId);
  if (ch) renderDetail(ch);
}

function buildSection(id, num, title, subtitle, content) {
  const isOpen = openSections.has(id);
  return `<div class="section-card">
    <div class="section-header" onclick="toggleSection('${id}')">
      <div class="section-header-left"><div class="section-number">${num}</div><div><div class="section-title">${title}</div><div class="section-subtitle">${subtitle}</div></div></div>
      <svg class="section-chevron ${isOpen?'open':''}" id="sec-chev-${id}" width="16" height="16" viewBox="0 0 256 256" fill="none"><path d="M181.66 133.66l-80 80a8 8 0 01-11.32-11.32L164.69 128 90.34 53.66a8 8 0 0111.32-11.32l80 80a8 8 0 010 11.32z" fill="currentColor"/></svg>
    </div>
    <div class="section-body ${isOpen?'open':''}" id="sec-body-${id}"><div class="section-inner">${content}</div></div>
  </div>`;
}
function toggleSection(id) {
  const b=document.getElementById(`sec-body-${id}`), c=document.getElementById(`sec-chev-${id}`);
  const o=b?.classList.contains('open');
  if(o){b?.classList.remove('open');c?.classList.remove('open');openSections.delete(id);}
  else{b?.classList.add('open');c?.classList.add('open');openSections.add(id);}
}
function rof(label, value, mono=false) {
  return `<div class="form-group"><label class="form-label">${label}</label>
    <div style="font-size:${mono?'12px':'14px'};font-family:${mono?"'IBM Plex Mono',monospace":'inherit'};color:var(--color-ink);padding:4px 0">${value||'—'}</div>
  </div>`;
}

function openCommissionSummaryModal() {
  const activeChannels = CHANNELS.filter(c => String(c.status || '').toLowerCase() === 'active');
  const rows = activeChannels.map(c => {
    const cfg = c.commConfig || {};
    const basis = String(cfg.basis || '');
    const parts = basis.split('/').map(v => v.trim());
    const newBusiness = parts[0] || cfg.rate || '—';
    const renewal = parts.find(v => /renewal/i.test(v)) || '—';
    const max = cfg.max || '—';
    return `
      <tr>
        <td><strong>${c.name}</strong></td>
        <td>${c.type || '—'}</td>
        <td style="font-weight:700">${cfg.rate || c.comm || '—'}</td>
        <td>${htmlEsc(newBusiness)}</td>
        <td>${htmlEsc(renewal)}</td>
        <td>${htmlEsc(max)}</td>
      </tr>`;
  }).join('');

  const totalActive = activeChannels.length;
  const totalCommissionRows = activeChannels.reduce((n, c) => n + (c.intermediaries?.length || 0), 0);

  PS.openModal(`
    <div class="modal-header">
      <h2 class="modal-title">Commission Summary</h2>
      <button class="btn btn-icon" onclick="PS.closeModal()" aria-label="Close">×</button>
    </div>
    <div class="modal-body">
      <p style="font-size:13px;color:var(--color-muted);margin-bottom:var(--space-4)">
        Commission structures across ${totalActive} active distribution channel${totalActive === 1 ? '' : 's'} for this product version.
      </p>
      <div style="overflow-x:auto">
        <table class="data-table">
          <thead><tr><th>Channel</th><th>Type</th><th>Standard Rate</th><th>New Business</th><th>Renewal</th><th>Max Override</th></tr></thead>
          <tbody>
            ${rows || `<tr><td colspan="6" style="text-align:center;color:var(--color-muted);padding:24px">No active distribution channels.</td></tr>`}
          </tbody>
        </table>
      </div>
      <div style="margin-top:var(--space-5);padding:var(--space-4);background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md)">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:var(--color-muted);margin-bottom:6px">Distribution Summary</div>
        <div style="font-size:13px;color:var(--color-ink)">
          ${totalActive} active channel${totalActive === 1 ? '' : 's'} · ${totalCommissionRows} intermediary relationship${totalCommissionRows === 1 ? '' : 's'} configured.
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="PS.closeModal()">Close</button>
    </div>
  `, 'modal-lg');
}

function openAddChannelModal() {
  const params = new URLSearchParams(location.search);
  const product = params.get('product') || params.get('id') || '';
  const qs = product ? `?product=${encodeURIComponent(product)}` : '';
  window.location.href = `/distribution/create${qs}`;
}
</script>
