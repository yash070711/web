function clearEligFieldError(el) {
  if (!el) return;
  el.classList.remove('is-invalid');
  el.nextElementSibling?.classList.contains('field-error') && el.nextElementSibling.remove();
}

function markEligError(el, message) {
  if (!el) return;
  el.classList.add('is-invalid');
  if (!el.nextElementSibling || !el.nextElementSibling.classList.contains('field-error')) {
    const p = document.createElement('div');
    p.className = 'field-error';
    p.textContent = message;
    el.insertAdjacentElement('afterend', p);
  } else {
    el.nextElementSibling.textContent = message;
  }
}

function notifyElig(title, msg, type) {
  if (PS.prototypeApp?.showResult) PS.prototypeApp.showResult(title, msg, { type: type || 'error' });
  else if (PS.actionResult) PS.actionResult(type || 'error', title, msg);
}

function validateEligibilityRule() {
  document.querySelectorAll('#detail-panel .is-invalid').forEach(el => el.classList.remove('is-invalid'));
  document.querySelectorAll('#detail-panel .field-error').forEach(el => el.remove());
  const rule = currentRule();
  if (!rule) return true;
  const first = [];
  const fail = (sel, msg) => {
    const el = document.querySelector(sel);
    markEligError(el, msg);
    if (el) first.push(el);
  };
  if (!String(rule.name || '').trim()) fail('#el-rule-name', 'Rule Name is required.');
  if (!String(rule.category || '').trim()) fail('#el-rule-category', 'Rule Category is required.');
  const pri = Number(rule.priority);
  if (!Number.isFinite(pri) || pri <= 0) fail('#el-rule-priority', 'Priority is required and must be a valid positive number.');
  if (!rule.outcomeType) {
    notifyElig('Cannot save', 'Outcome is required.', 'error');
    first.push(document.querySelector('.outcome-card'));
  }
  if (!String(rule.cover || '').trim()) fail('#el-rule-cover', 'Applicable Cover is required.');
  if (!String(rule.reasonCode || '').trim()) fail('#el-reason-code', 'This field is required.');
  if (isPlaceholderDate(rule.effectiveFrom) || !isoDateValue(rule.effectiveFrom)) fail('#el-effective-from', 'This field is required.');
  if (isPlaceholderDate(rule.effectiveTo) || !isoDateValue(rule.effectiveTo)) fail('#el-effective-to', 'This field is required.');
  const fromT = Date.parse(isoDateValue(rule.effectiveFrom));
  const toT = Date.parse(isoDateValue(rule.effectiveTo));
  if (!Number.isNaN(fromT) && !Number.isNaN(toT) && toT < fromT) fail('#el-effective-to', 'Effective To cannot be earlier than Effective From.');
  const linked = findRiskAttr(primaryLinkedAttributeId(rule));
  if (!linked || !isAttrAvailableForNewRules(linked)) {
    notifyElig('Cannot save', 'This Risk Attribute is no longer available for Eligibility. Update the configuration in Risk Studio.', 'error');
    first.push(document.querySelector('.elig-linked-card'));
  }
  if ((rule.outcomeType === 'hard' || rule.outcomeType === 'soft') && !String(rule.customerMsg || '').trim()) {
    fail('#el-customer-msg', 'Customer-facing message is required for Hard Block and Soft Warning.');
  }
  if (!String(rule.internalMsg || '').trim()) fail('#el-internal-msg', 'Internal message is required.');
  const ids = RULES.map(r => r.id);
  if (ids.filter(id => id === rule.id).length > 1) {
    notifyElig('Cannot save', 'Rule ID must remain unique.', 'error');
  }
  const conditions = rule.conditions || [];
  if (!conditions.length) {
    notifyElig('Cannot save', 'Add at least one complete condition.', 'error');
    first.push(document.querySelector('.condition-builder'));
  }
  conditions.forEach((c, i) => {
    const attr = resolveConditionAttr(c);
    const found = findQuestionById(c.sourceQuestionId || attr?.questionId);
    const type = riskDataType(attr, found?.q);
    if (!c.attributeId && !attr) fail(`[data-el-validate="cond-attr-${i}"]`, 'Risk Attribute is required.');
    if (conditionIsUnavailable(c)) fail(`[data-el-validate="cond-attr-${i}"]`, 'Risk Attribute is no longer available in Risk Studio.');
    if (!c.op) fail(`[data-el-validate="cond-op-${i}"]`, 'Operator is required.');
    if (opNeedsValue(c.op) && String(c.value || '').trim() === '') {
      fail(`[data-el-validate="cond-val-${i}"]`, 'This field is required.');
    } else if (opNeedsTwoValues(c.op) && String(c.value2 || '').trim() === '') {
      fail(`[data-el-validate="cond-val2-${i}"]`, 'This field is required.');
    } else if (opNeedsValue(c.op) && (type === 'number' || type === 'currency') && Number.isNaN(Number(c.value))) {
      fail(`[data-el-validate="cond-val-${i}"]`, 'Enter a valid numeric value.');
    } else if (opNeedsValue(c.op) && type === 'date' && c.value && Number.isNaN(Date.parse(c.value)) && !/^\d{4}-\d{2}-\d{2}$/.test(c.value) && Number.isNaN(Date.parse(String(c.value)))) {
      fail(`[data-el-validate="cond-val-${i}"]`, 'Enter a valid date.');
    } else if (opNeedsValue(c.op) && (type === 'select' || type === 'multi-select')) {
      const allowed = questionOptions(attr, found?.q);
      if (allowed.length) {
        const vals = String(c.value || '').split(',').map(s => s.trim()).filter(Boolean);
        const ok = vals.every(v => allowed.some(o => o.value === v || o.label === v));
        if (!ok) fail(`[data-el-validate="cond-val-${i}"]`, 'Value must be one of the configured options.');
      }
    }
  });
  if (first.length) {
    const el = first[0];
    el?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    el?.focus?.();
    notifyElig('Cannot save', 'Complete the required eligibility fields.', 'error');
    return false;
  }
  return true;
}

function nextEligibilityRuleId() {
  let n = RULES.length + 1;
  let id = `ELG-${String(n).padStart(3, '0')}`;
  while (RULES.some(r => r.id === id)) {
    n += 1;
    id = `ELG-${String(n).padStart(3, '0')}`;
  }
  return id;
}

function allEligibilityQuestions() {
  const out = [];
  const seen = new Set();
  productQuestionGroups().forEach(group => {
    (group.questions || []).forEach(q => {
      if (!q || !q.id || seen.has(String(q.id))) return;
      seen.add(String(q.id));
      out.push({ q, group });
    });
  });
  return out;
}

function questionFieldKey(q) {
  if (!q) return '';
  return q.internalName || q.fieldKey || slugField(q.label || q.id);
}

function conditionFromQuestion(q) {
  const c = emptyCondition();
  if (!q) return c;
  const type = riskDataType(null, q);
  c.sourceQuestionId = q.id;
  c.field = questionFieldKey(q);
  c.op = operatorsForType(type)[0] || '';
  return c;
}

function createEligibilityRuleFromQuestions() {
  const ids = [...new Set(Array.from(document.querySelectorAll('.elig-question-cb:checked')).map(el => String(el.value)).filter(Boolean))];

    notifyElig('No questions selected', 'Select at least one Questionnaire question.', 'error');
    return;
  }

  const questions = ids.map(id => findQuestionById(id)?.q).filter(Boolean);
  if (!questions.length) {
    notifyElig('Cannot create rule', 'The selected Questionnaire questions are no longer available.', 'error');
    return;
  }

  const id = nextEligibilityRuleId();
  const first = questions[0];
  const name = `${first.label || first.id} Eligibility`;
  const rule = normalizeEligibilityRule({
    id,
    name,
    category: 'Product Eligibility',
    cover: 'All Covers',
    coverIds: [],
    priority: 10,
    status: 'active',
    description: '',
    source: 'Questionnaire',
    sourceQuestionId: first.id,
    linkedQuestionIds: ids,
    conditions: questions.map(conditionFromQuestion),
    outcomeType: 'hard',
    logic: 'and',
    reasonCode: id,
    customerMsg: 'This risk does not meet eligibility requirements for this product.',
    internalMsg: 'Eligibility rule triggered.',
    logAudit: true,
    effectiveFrom: defaultEffectiveDates().from,
    effectiveTo: defaultEffectiveDates().to,
    scopes: {
      product: productName || PS.studioHub?.productName || 'This product',
      version: productVersion ? `v${productVersion}` : '—',
      covers: ['All Covers'],
      segments: ['All Segments'],
      channels: ['All Channels']
    }
  });

  RULES.push(rule);
  persistRules();
  PS.closeModal();
  activeRuleId = id;
  refreshEligibilityMeta();
  PS.studioHub?.paint?.();
  PS.studioHub?.open?.(id);
  notifyElig('Eligibility rule created', `${questions.length} Questionnaire question${questions.length === 1 ? '' : 's'} linked to ${name}.`, 'success');
}

              <div class="outcome-card-desc">Quote proceeds with warning</div>
            </div>
            <div id="me-out-refer" class="outcome-card" onclick="setManualEligibilityOutcome('refer')">
              <div class="outcome-card-icon">👤</div>
              <div class="outcome-card-label">Refer to UW</div>
              <div class="outcome-card-desc">Routes to underwriter queue</div>
            </div>
          </div>

          <div class="form-grid-2">
            <div class="form-group">
              <label class="form-label" for="me-reason">Reason Code <span class="required">*</span></label>
              <input id="me-reason" class="form-control" value="${htmlEsc(id)}" placeholder="e.g., ELIG-TERRITORY">
            </div>
            <div class="form-group">
              <label class="form-label" for="me-description">Description</label>
              <input id="me-description" class="form-control" placeholder="Internal rule description">
            </div>
            <div class="form-group span-2">
              <label class="form-label" for="me-customer-msg">Customer Message</label>
              <textarea id="me-customer-msg" class="form-control" rows="2" placeholder="Message shown when this rule is triggered">This risk does not meet eligibility requirements for this product.</textarea>
            </div>
            <div class="form-group span-2">
              <label class="form-label" for="me-internal-msg">Internal Message</label>
              <textarea id="me-internal-msg" class="form-control" rows="2" placeholder="Internal decision message">Eligibility rule triggered.</textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="window.__eligManualCreate=null; PS.closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="createManualEligibilityRule()">Create Rule</button>
        </div>
      </div>
    `);
    renderManualEligibilityConditionRows();
  }, 0);
}

function createManualEligibilityRule() {
  const draft = window.__eligManualCreate;
  if (!draft) return;

  const nameEl = document.getElementById('me-name');
  const catEl = document.getElementById('me-category');
  const priEl = document.getElementById('me-priority');
  const first = [];
  document.querySelectorAll('#active-modal-overlay .is-invalid').forEach(el => el.classList.remove('is-invalid'));
  document.querySelectorAll('#active-modal-overlay .field-error').forEach(el => el.remove());

  const fail = (el, msg) => { markEligError(el, msg); if (el) first.push(el); };
  const name = nameEl?.value.trim();
  const category = catEl?.value;
  const priority = Number(priEl?.value);

  if (!name) fail(nameEl, 'This field is required.');
  if (!category) fail(catEl, 'This field is required.');
  if (!Number.isFinite(priority) || priority <= 0) fail(priEl, 'Priority is required and must be a valid positive number.');
  if (!draft.outcomeType) {
    notifyElig('Cannot create rule', 'Outcome is required.', 'error');
    return;
  }

  (draft.conditions || []).forEach((c, i) => {
    const fieldEl = document.getElementById(`me-field-${i}`);
    const opEl = document.getElementById(`me-op-${i}`);
    const valEl = document.getElementById(`me-value-${i}`);
    if (!String(c.field || '').trim()) fail(fieldEl, 'Field or attribute name is required.');
    if (!String(c.op || '').trim()) fail(opEl, 'Operator is required.');
    if (opNeedsValue(c.op) && !String(c.value || '').trim()) fail(valEl, 'Enter a value.');
  });

  if (first.length) {
    first[0]?.scrollIntoView({ behavior:'smooth', block:'center' });
    first[0]?.focus?.();
    notifyElig('Cannot create rule', 'Complete the required fields.', 'error');
    return;
  }

  const id = draft.id || nextManualEligibilityRuleId();
  const coverVal = document.getElementById('me-cover')?.value || 'ALL';
  const coverIds = [];
  let cover = 'All Covers';
  if (coverVal !== 'ALL') {
    const match = productCovers().find(c => String(c.id) === String(coverVal));
    cover = match?.name || match?.code || coverVal;
    coverIds.push(match?.id || coverVal);
  }

  const rule = normalizeEligibilityRule({
    id,
    name,
    category,
    cover,
    coverIds,
    priority,
    description: document.getElementById('me-description')?.value.trim() || '',
    source: 'Manual',
    sourceQuestionId: '',
    riskAttributeId: '',
    lastUpdated: new Date().toISOString().slice(0,10),
    reasonCode: document.getElementById('me-reason')?.value.trim() || id,
    customerMsg: document.getElementById('me-customer-msg')?.value.trim() || '',
    internalMsg: document.getElementById('me-internal-msg')?.value.trim() || '',
    conditions: (draft.conditions || []).map(c => ({
      attributeId: '',
      sourceQuestionId: '',
      field: String(c.field || '').trim(),
      op: normalizeOp(c.op || ''),
      value: String(c.value || ''),
      value2: String(c.value2 || ''),
      connector: c.connector || 'AND'
    })),
    outcomeType: draft.outcomeType,
    logic: draft.logic || 'and',
    logAudit: true,
    effectiveFrom: '—',
    effectiveTo: '—',
    scopes: {
      product: productName || PS.studioHub?.productName || 'This product',
      version: productVersion ? `v${productVersion}` : '—',
      covers: [cover],
      segments: ['All Segments'],
      channels: ['All Channels']
    }
  });

  RULES.push(rule);
  persistRules();
  window.__eligManualCreate = null;
  PS.closeModal();
  refreshEligibilityMeta();
  PS.studioHub?.paint?.();
  PS.studioHub?.open?.(id);
  notifyElig('Eligibility rule created', `${name} was added to this product.`, 'success');
}

function setCreateOutcome(type) {
  if (!window.__eligCreate) return;
  window.__eligCreate.outcomeType = type;
  ['hard', 'soft', 'refer'].forEach(t => document.getElementById(`ar-out-${t}`)?.classList.toggle('selected', t === type));
}

function renderCreateConditionBuilder() {
  const host = document.getElementById('ar-condition-host');
  const draft = window.__eligCreate;
  if (!host || !draft) return;
  const conditions = draft.conditions;
  const logic = String(draft.logic || 'and');
  host.innerHTML = `
    <div class="cb-header" style="border-bottom:1px solid var(--color-border)">
      <span style="font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--color-muted)">CONDITION BUILDER</span>
      <div class="cb-logic">
        <button type="button" class="cb-logic-btn ${logic==='and'?'active':''}" onclick="setCreateLogic('and')">ALL</button>
        <button type="button" class="cb-logic-btn ${logic==='or'?'active':''}" onclick="setCreateLogic('or')">ANY</button>
      </div>
    </div>
    <div class="cb-when">WHEN</div>
    ${conditions.map((c, i) => {
      const attr = resolveConditionAttr(c);
      const found = findQuestionById(c.sourceQuestionId || attr?.questionId);
      const type = riskDataType(attr, found?.q);
      const ops = operatorsForType(type);
      const op = normalizeOp(c.op);
      return `
      ${i > 0 ? `<div class="cb-connector">${htmlEsc((c.connector || (logic === 'or' ? 'OR' : 'AND')).toUpperCase())}</div>` : ''}
      <div class="cb-row">
        <select class="form-control" style="flex:1.6" id="ar-attr-${i}" onchange="patchCreateConditionAttr(${i}, this.value)">
          ${groupedAttrOptionsHtml(c.attributeId || '', attr, '')}
        </select>
        <select class="form-control" style="width:130px" id="ar-op-${i}" onchange="patchCreateCondition(${i}, 'op', this.value)">
          <option value="">Operator</option>
          ${ops.map(o => `<option ${o === op ? 'selected' : ''}>${htmlEsc(o)}</option>`).join('')}
        </select>
        ${createValueControl(c, i, type, op)}
        ${conditions.length > 1 ? `<button type="button" class="btn btn-ghost btn-sm" onclick="removeCreateCondition(${i})">Remove</button>` : ''}
      </div>
      ${attr ? `<div class="cb-source" style="margin-top:0"><strong>${htmlEsc(attrDisplayName(attr))}</strong> · ${htmlEsc(attr.id)} · Questionnaire → Risk Studio</div>` : ''}`;
    }).join('')}
    <div class="cb-actions">
      <button type="button" class="btn btn-ghost btn-sm" onclick="addCreateCondition('AND')">+ Add Condition</button>
      <button type="button" class="btn btn-ghost btn-sm" onclick="addCreateCondition('OR')">+ Add OR Group</button>
    </div>`;
}

function setCreateLogic(logic) {
  if (!window.__eligCreate) return;
  window.__eligCreate.logic = logic === 'or' ? 'or' : 'and';
  renderCreateConditionBuilder();
}

function createValueControl(c, i, type, op) {
  if (!opNeedsValue(op)) return `<input class="form-control cb-value" disabled placeholder="Not required">`;
  if (opNeedsTwoValues(op)) {
    return `<span style="display:flex;gap:8px;flex:1"><input type="number" class="form-control" id="ar-val-${i}" value="${htmlEsc(c.value || '')}" placeholder="From" oninput="patchCreateCondition(${i}, 'value', this.value)"><input type="number" class="form-control" id="ar-val2-${i}" value="${htmlEsc(c.value2 || '')}" placeholder="To" oninput="patchCreateCondition(${i}, 'value2', this.value)"></span>`;
  }
  if (type === 'boolean') {
    return `<select class="form-control cb-value" id="ar-val-${i}" onchange="patchCreateCondition(${i}, 'value', this.value)"><option value="">Select</option><option ${c.value === 'Yes' ? 'selected' : ''}>Yes</option><option ${c.value === 'No' ? 'selected' : ''}>No</option></select>`;
  }
  const attr = resolveConditionAttr(c);
  const found = findQuestionById(c.sourceQuestionId || attr?.questionId);
  const opts = questionOptions(attr, found?.q);
  if ((type === 'select' || type === 'multi-select' || op === 'IN' || op === 'NOT IN') && opts.length) {
    return `<select class="form-control cb-value" id="ar-val-${i}" onchange="patchCreateCondition(${i}, 'value', this.value)"><option value="">Select</option>${opts.map(o => `<option value="${htmlEsc(o.value)}" ${String(c.value) === o.value ? 'selected' : ''}>${htmlEsc(o.label)}</option>`).join('')}</select>`;
  }
  const inputType = type === 'date' ? 'date' : (type === 'number' || type === 'currency' ? 'number' : 'text');
  return `<input type="${inputType}" class="form-control cb-value" id="ar-val-${i}" value="${htmlEsc(c.value || '')}" placeholder="Enter a value." oninput="patchCreateCondition(${i}, 'value', this.value)">`;
}

function patchCreateCondition(i, key, value) {
  const draft = window.__eligCreate;
  if (!draft?.conditions[i]) return;
  draft.conditions[i][key] = value;
  if (key === 'op') renderCreateConditionBuilder();
}

function patchCreateConditionAttr(i, attributeId) {
  const draft = window.__eligCreate;
  if (!draft?.conditions[i]) return;
  const attr = findRiskAttr(attributeId);
  const found = findQuestionById(attr?.questionId || attr?.sourceQuestionId);
  draft.conditions[i].attributeId = attributeId;
  draft.conditions[i].sourceQuestionId = attr?.questionId || attr?.sourceQuestionId || '';
  draft.conditions[i].field = attr ? riskAttributeFieldKey(attr) : '';
  draft.conditions[i].op = operatorsForType(riskDataType(attr, found?.q))[0] || '';
  draft.conditions[i].value = '';
  draft.conditions[i].value2 = '';
  renderCreateConditionBuilder();
}

function addCreateCondition(connector) {
  const draft = window.__eligCreate;
  if (!draft) return;
  const c = emptyCondition();
  c.connector = connector || 'AND';
  draft.conditions.push(c);
  renderCreateConditionBuilder();
}

function removeCreateCondition(i) {
  const draft = window.__eligCreate;
  if (!draft || draft.conditions.length <= 1) return;
  draft.conditions.splice(i, 1);
  renderCreateConditionBuilder();
}

function createEligibilityRule() {
  const nameEl = document.getElementById('ar-name');
  const catEl = document.getElementById('ar-cat');
  document.querySelectorAll('#active-modal-overlay .is-invalid').forEach(el => el.classList.remove('is-invalid'));
  document.querySelectorAll('#active-modal-overlay .field-error').forEach(el => el.remove());
  const name = nameEl?.value.trim();
  const category = catEl?.value;
  const draft = window.__eligCreate || { conditions: [emptyCondition()], outcomeType: 'hard' };
  const first = [];
  const fail = (el, msg) => { markEligError(el, msg); if (el) first.push(el); };
  if (!name) fail(nameEl, 'This field is required.');
  if (!category) fail(catEl, 'This field is required.');
  const priEl = document.getElementById('ar-priority');
  const pri = Number(priEl?.value);
  if (!Number.isFinite(pri) || pri <= 0) fail(priEl, 'Priority is required and must be a valid positive number.');
  if (!draft.outcomeType) {
    notifyElig('Cannot create rule', 'Outcome is required.', 'error');
    first.push(document.querySelector('#ar-out-hard'));
  }
  if (!eligibilityRiskAttributes().length) {
    notifyElig('Cannot create rule', 'Mark Risk Attributes as Available for Eligibility in Risk Studio first.', 'error');
    return;
  }
  (draft.conditions || []).forEach((c, i) => {
    const attrEl = document.getElementById(`ar-attr-${i}`);
    const opEl = document.getElementById(`ar-op-${i}`);
    const valEl = document.getElementById(`ar-val-${i}`);
    if (!c.attributeId) fail(attrEl, 'This field is required.');
    if (!c.op) fail(opEl, 'This field is required.');
    if (opNeedsValue(c.op) && !String(c.value || '').trim()) fail(valEl, 'Enter a value.');
    if (opNeedsTwoValues(c.op) && !String(c.value2 || '').trim()) fail(document.getElementById(`ar-val2-${i}`), 'Enter a value.');
    const attr = resolveConditionAttr(c);
    const type = riskDataType(attr, findQuestionById(c.sourceQuestionId || attr?.questionId)?.q);
    if (opNeedsValue(c.op) && (type === 'number' || type === 'currency') && String(c.value) && Number.isNaN(Number(c.value))) fail(valEl, 'Value must be numeric.');
  });
  if (first.length) {
    first[0]?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    first[0]?.focus?.();
    notifyElig('Cannot create rule', 'Complete the required fields.', 'error');
    return;
  }
  const id = nextEligibilityRuleId();
  const coverVal = document.getElementById('ar-cover')?.value || 'ALL';
  const priority = pri;
  const description = document.getElementById('ar-desc')?.value.trim() || '';
  const coverIds = [];
  let cover = 'All Covers';
  if (coverVal && coverVal !== 'ALL') {
    const match = productCovers().find(c => String(c.id) === String(coverVal));
    cover = match?.name || match?.code || coverVal;
    coverIds.push(match?.id || coverVal);
  }
  const tpl = normalizeEligibilityRule({
    id, name, category, cover, priority, description, coverIds,
    source: 'Product',
    lastUpdated: new Date().toISOString().slice(0, 10),
    reasonCode: `ELIG-${id.replace(/\D/g, '') || Date.now().toString().slice(-6)}`,
    conditions: draft.conditions.map(normalizeCondition),
    outcomeType: draft.outcomeType || 'hard',
    logic: draft.logic || 'and'
  });
  RULES.push(tpl);
  persistRules();
  PS.closeModal();
  refreshEligibilityMeta();
  PS.studioHub?.paint?.();
  PS.studioHub?.open?.(id);
  notifyElig('Eligibility rule created', `${name} was added to this product.`, 'success');
}
</script>
<script src="assets/studio-help.js"></script>
<script src="assets/underwriting-rule-store.js"></script>
<script src="assets/prototype-app.js"></script>
<script>
(function wrapEligibilitySaveAndCreate() {
  const origBar = window.addStudioSaveBar;
  window.addStudioSaveBar = function () {
    if (typeof origBar === 'function') origBar();
    const btn = document.getElementById('ps-save-studio');
    if (!btn) return;
    const prev = btn.onclick;
    btn.onclick = function (e) {
      if (!validateEligibilityRule()) return;
      if (!commitPendingEligibilityRule()) return;
      persistRules();
      renderRuleList();
      if (typeof prev === 'function') prev.call(this, e);
      notifyElig('Eligibility rule saved', 'The rule was saved in Eligibility Studio.', 'success');
      PS.studioHub?.paint?.();
      openRuleEditor(activeRuleId);
    };
  };
  document.addEventListener('DOMContentLoaded', function () {});
})();
</script>
