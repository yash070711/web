<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eligibility Studio — Insurance Product Studio</title>
  <meta name="description" content="Define eligibility conditions for insurance products — determine when a product or cover can be offered to a risk.">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/studio-hub.css">
  <style>
    /* Editor two-panel layout — used only in the rule editor state */
    .studio-layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: var(--space-4);
      align-items: start;
    }
    .elig-main-page { min-width: 0; }
    @media (max-width: 1100px) {
      .studio-layout { grid-template-columns: 1fr; }
      .studio-layout .rule-sidebar { position: relative; top: auto; }
    }
    .elig-avail-wrap { overflow-x: auto; }
    .elig-linked-card {
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-lg); padding: var(--space-4) var(--space-5); margin-bottom: var(--space-4);
      overflow: visible;
    }
    .elig-linked-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px 20px; font-size:13px; }
    .elig-linked-grid .k { font-size:11px; color:var(--color-muted); text-transform:uppercase; letter-spacing:.4px; }
    .elig-linked-grid .v { font-weight:600; margin-top:2px; }
    @media (max-width: 900px) { .elig-linked-grid { grid-template-columns:1fr 1fr; } }

    /* ── Rule list sidebar ─────────────────────── */
    .rule-sidebar { position: sticky; top: calc(56px + var(--space-6)); }
    .rule-list { display: flex; flex-direction: column; gap: 4px; padding: var(--space-2); max-height: calc(100vh - 220px); overflow-y: auto; }
    .rule-section-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .6px; color: var(--color-muted);
      padding: var(--space-3) var(--space-3) var(--space-2);
    }
    .rule-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-md); cursor: pointer;
      border: 1px solid transparent;
      transition: background .12s, border-color .12s;
    }
    .rule-item:hover { background: var(--color-surface); border-color: var(--color-border); }
    .rule-item.active {
      background: var(--color-brand-light);
      border-color: rgba(214, 158, 46, .35);
      box-shadow: inset 3px 0 0 var(--color-brand);
    }
    .rule-status-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px;
    }
    .rule-status-dot.active { background: var(--color-success); box-shadow: 0 0 0 3px rgba(74,222,128,.18); }
    .rule-status-dot.warning { background: var(--color-warning); box-shadow: 0 0 0 3px rgba(245,158,11,.18); }
    .rule-status-dot.inactive { background: var(--color-disabled); }
    .rule-item-body { flex: 1; min-width: 0; }
    .rule-item-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .rule-item-name { font-size: 13px; font-weight: 500; color: var(--color-ink); line-height: 1.3; }
    .rule-item.active .rule-item-name { color: var(--color-brand); font-weight: 600; }
    .rule-priority {
      flex-shrink: 0; font-size: 9px; font-weight: 700; font-family: 'IBM Plex Mono', monospace;
      padding: 2px 6px; border-radius: 4px;
      background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-muted);
    }
    .rule-item.active .rule-priority { background: rgba(214,158,46,.12); border-color: rgba(214,158,46,.25); color: var(--color-brand); }
    .rule-item-id {
      font-size: 10px; font-family: 'IBM Plex Mono', monospace;
      color: var(--color-muted); margin-top: 3px;
    }
    .rule-item-cond {
      font-size: 11px; color: var(--color-muted); margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .rule-item-meta {
      font-size: 10px; color: var(--color-muted); margin-top: 5px;
      display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    }
    .rule-cover-badge {
      display: inline-flex; height: 18px; padding: 0 7px;
      border-radius: 100px; font-size: 9px; font-weight: 600;
      align-items: center;
      background: rgba(124,58,237,.14); color: #C4B5FD; border: 1px solid rgba(124,58,237,.25);
    }
    .rule-outcome-badge {
      display: inline-flex; height: 18px; padding: 0 7px;
      border-radius: 100px; font-size: 9px; font-weight: 600; align-items: center;
      background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-muted);
    }
    .rule-outcome-badge.hard { background: rgba(248,113,113,.12); border-color: rgba(248,113,113,.25); color: #FCA5A5; }
    .rule-outcome-badge.soft { background: rgba(245,158,11,.12); border-color: rgba(245,158,11,.25); color: #FCD34D; }
    .rule-add-btn {
      width: calc(100% - var(--space-4)); display: flex; align-items: center; justify-content: center; gap: var(--space-2);
      padding: 9px var(--space-3); font-size: 12px; font-weight: 500; color: var(--color-muted);
      border: 1px dashed var(--color-border); border-radius: var(--radius-md);
      background: none; cursor: pointer; margin: var(--space-2); transition: all .12s;
    }
    .rule-add-btn:hover { border-color: var(--color-brand); color: var(--color-brand); background: var(--color-brand-light); }
    .rule-sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-4) var(--space-4) var(--space-3);
      border-bottom: 1px solid var(--color-border);
    }
    .rule-sidebar-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .55px; color: var(--color-muted);
    }
    .rule-sidebar-count { font-size: 11px; color: var(--color-muted); margin-top: 2px; }

    /* ── Section card ──────────────────────────── */
    .section-card { background: var(--color-panel); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); cursor: pointer; user-select: none; transition: background .1s; }
    .section-header:hover { background: var(--color-surface); }
    .section-header-left { display: flex; align-items: center; gap: var(--space-3); }
    .section-number { width: 24px; height: 24px; border-radius: 50%; background: var(--color-brand-light); color: var(--color-brand); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .section-title { font-size: 14px; font-weight: 600; }
    .section-subtitle { font-size: 12px; color: var(--color-muted); margin-top: 1px; }
    .section-chevron { color: var(--color-muted); transition: transform .2s; }
    .section-chevron.open { transform: rotate(90deg); }
    .section-body { border-top: 1px solid var(--color-border); max-height: 0; overflow: hidden; }
    .section-body.open { max-height: none; overflow: visible; }
    .section-inner { padding: var(--space-5) var(--space-6); }

    /* ── Form helpers ──────────────────────────── */
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-6); }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-4); }
    .span-2 { grid-column: 1 / -1; }

    /* ── Toggle ────────────────────────────────── */
    .toggle-wrap { display: flex; align-items: center; gap: var(--space-3); font-size: 13px; }
    .toggle-switch { position: relative; width: 40px; height: 22px; display: inline-block; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; inset: 0; border-radius: 11px; cursor: pointer; transition: .2s; }
    .toggle-on  .toggle-slider { background: var(--color-brand); }
    .toggle-off .toggle-slider { background: var(--color-disabled); }
    .toggle-dot { position: absolute; top: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: .2s; }
    .toggle-on  .toggle-dot { left: calc(100% - 20px); }
    .toggle-off .toggle-dot { left: 2px; }

    /* ── Condition builder ─────────────────────── */

    /* Condition Builder UI refinement */
    .condition-builder {
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fff;
      overflow: hidden;
    }

    .condition-builder .cb-header {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      background: #fbf9f5;
      border-bottom: 1px solid var(--color-border);
    }

    .condition-builder .cb-logic {
      display: inline-flex;
      border: 1px solid var(--color-border);
      border-radius: 5px;
      overflow: hidden;
      background: #fff;
    }

    .condition-builder .cb-logic-btn {
      min-width: 42px;
      height: 26px;
      padding: 0 10px;
      border: 0;
      background: #fff;
      color: var(--color-ink);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    .condition-builder .cb-logic-btn + .cb-logic-btn {
      border-left: 1px solid var(--color-border);
    }

    .condition-builder .cb-logic-btn.active {
      background: #fff1d2;
      color: #a86600;
    }

    .condition-builder .cb-when {
      padding: 12px 16px 6px;
      font-size: 11px;
      font-family: 'IBM Plex Mono', monospace;
      font-weight: 700;
      color: var(--color-muted);
    }

    .condition-builder .cb-row {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) 130px minmax(180px, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 10px 16px 12px;
      border-bottom: 1px solid var(--color-border);
      background: #fff;
    }

    .condition-builder .cb-row > .form-control,
    .condition-builder .cb-row .cb-value,
    .condition-builder .cb-row .cb-value > .form-control {
      min-width: 0;
      width: 100%;
      box-sizing: border-box;
    }

    .condition-builder .cb-row .cb-remove {
      white-space: nowrap;
    }

    .condition-builder .cb-connector {
      width: max-content;
      margin: 0 0 0 16px;
      padding: 5px 9px;
      border-radius: 6px;
      background: #fbf6eb;
      color: var(--color-muted);
      font-size: 11px;
      font-weight: 700;
    }

    .condition-builder .cb-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 12px 16px;
      background: #fbf9f5;
    }

    .condition-builder .cb-actions .btn {
      border-color: var(--color-border);
      background: #fff;
    }

    .condition-builder .cb-empty {
      padding: 18px 16px;
      text-align: center;
      color: var(--color-muted);
      font-size: 13px;
    }

    .condition-builder + .compiled-expression,
    .compiled-expression {
      margin-top: 16px;
      padding: 14px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: #fff;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      line-height: 1.7;
      color: var(--color-ink);
    }

    .compiled-expression .compiled-title {
      display: block;
      margin-bottom: 6px;
      font-size: 11px;
      color: var(--color-muted);
    }

    @media (max-width: 800px) {
      .condition-builder .cb-row {
        grid-template-columns: 1fr;
      }

      .condition-builder .cb-row .cb-remove {
        justify-self: start;
      }

      .condition-builder .cb-actions {
        flex-wrap: wrap;
      }
    }

    .condition-builder { border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
    .cb-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface); border-bottom: 1px solid var(--color-border);
    }
    .cb-direction {
      display: inline-flex; border-radius: var(--radius-md); overflow: hidden;
      border: 1px solid var(--color-border);
    }
    .cb-dir-btn {
      padding: 4px 12px; border: none; font-size: 11px; font-weight: 600;
      cursor: pointer; text-transform: uppercase; letter-spacing: .3px;
      background: var(--color-panel); color: var(--color-muted); transition: all .15s;
    }
    .cb-dir-btn.active { background: var(--color-brand); color: #fff; }
    .cb-logic {
      display: inline-flex; border-radius: var(--radius-sm); overflow: hidden;
      border: 1px solid var(--color-border);
    }
    .cb-logic-btn {
      padding: 3px 10px; border: none; font-size: 10px; font-weight: 700;
      cursor: pointer; text-transform: uppercase; letter-spacing: .5px;
      background: var(--color-panel); color: var(--color-muted); transition: all .15s;
    }
    .cb-logic-btn.active { background: var(--color-brand-light); color: var(--color-brand); }
    .cb-row {
      display: grid;
      grid-template-columns: minmax(220px, 1.6fr) 130px minmax(180px, 1fr) auto;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
    }
    .cb-row .cb-value { min-width: 0; width: 100%; }
    .cb-row .cb-value input,
    .cb-row .cb-value select { width: 100%; box-sizing: border-box; }
    .cb-row .cb-remove { white-space: nowrap; }
    @media (max-width: 800px) {
      .cb-row { grid-template-columns: 1fr; }
      .cb-row .cb-remove { justify-self: start; }
    }
    .elig-about {
      background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius-lg);
      padding: var(--space-4) var(--space-5); margin-bottom: var(--space-5);
      box-shadow: var(--shadow-sm);
    }
    .elig-about p { margin: 0; font-size: 13px; color: var(--color-muted); line-height: 1.5; }
    .elig-about strong { color: var(--color-ink); }
    .elig-flow { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; }
    .elig-flow-step { background:var(--color-surface); border:1px solid var(--color-border); border-radius:8px; padding:8px 10px; font-size:11px; color:var(--color-ink); max-width:160px; }
    .elig-flow-step span { display:block; font-size:10px; color:var(--color-muted); margin-top:2px; }
    .elig-flow-arrow { color:var(--color-muted); font-size:14px; }
    .elig-avail { background:#fff; border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--space-4) var(--space-5); margin-bottom:var(--space-5); box-shadow:var(--shadow-sm); }
    .elig-avail table { width:100%; border-collapse:collapse; font-size:13px; }
    .elig-avail th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.4px; color:var(--color-muted); padding:8px 10px; border-bottom:1px solid var(--color-border); }
    .elig-avail td { padding:8px 10px; border-bottom:1px solid var(--color-border); vertical-align:top; }
    .elig-avail-layout { display:grid; grid-template-columns:220px 1fr; gap:16px; align-items:start; }
    @media (max-width: 900px) { .elig-avail-layout { grid-template-columns:1fr; } }
    .elig-group-nav { border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden; background:var(--color-surface); }
    .elig-group-row { display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 10px; cursor:pointer; font-size:12px; border-bottom:1px solid var(--color-border); }
    .elig-group-row:last-child { border-bottom:none; }
    .elig-group-row:hover { background:#fff; }
    .elig-group-row.active { background:var(--color-brand-light); color:var(--color-brand); font-weight:600; }
    .elig-group-count { font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--color-muted); }
    .elig-attr-id { font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--color-muted); margin-top:2px; }
    .elig-attr-src { font-size:11px; color:var(--color-muted); margin-top:2px; }
    .elig-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px; }
    @media (max-width: 900px) { .elig-info-grid { grid-template-columns:1fr; } }
    .cb-when {
      padding: 10px var(--space-4) 0; font-size: 11px; font-weight: 700;
      letter-spacing: .6px; text-transform: uppercase; color: var(--color-muted);
    }
    .cb-source {
      margin: 0 var(--space-4) 12px; padding: 8px 10px;
      background: var(--color-surface); border: 1px dashed var(--color-border);
      border-radius: var(--radius-md); font-size: 11px; color: var(--color-muted); line-height: 1.45;
    }
    .cb-source strong { color: var(--color-ink); font-weight: 600; }
    .cb-filter { display: flex; gap: 8px; align-items: center; padding: 8px var(--space-4) 0; }
    .elig-create-mode-modal .elig-create-choice-list { display:flex; flex-direction:column; gap:10px; }
    .elig-create-mode-modal .elig-create-choice {
      width:100%; display:flex; align-items:flex-start; gap:12px; text-align:left;
      padding:14px 16px; border:1px solid var(--color-border); border-radius:var(--radius-md);
      background:var(--color-panel); cursor:pointer; transition:border-color .12s, background .12s;
    }
    .elig-create-mode-modal .elig-create-choice:hover { border-color:var(--color-brand); background:var(--color-brand-light); }
    .elig-create-mode-modal .elig-create-choice-radio { font-size:20px; line-height:1; color:var(--color-brand); margin-top:1px; }
    .elig-create-mode-modal .elig-create-choice strong { display:block; font-size:14px; color:var(--color-ink); }
    .elig-create-mode-modal .elig-create-choice small { display:block; margin-top:4px; font-size:12px; line-height:1.45; color:var(--color-muted); }
    .elig-create-note { margin-top:12px; padding:10px 12px; border-radius:8px; background:#FFFBEB; color:#92400E; border:1px solid #F59E0B; font-size:12px; }
    .manual-eligibility-modal .manual-eligibility-body { max-height:70vh; overflow:auto; }
    .manual-eligibility-modal .manual-eligibility-intro { margin:0 0 16px; font-size:13px; color:var(--color-muted); line-height:1.5; }
    .manual-eligibility-modal .manual-elig-row { align-items:center; }
    @media (max-width: 760px) { .manual-eligibility-modal .form-grid-2 { grid-template-columns:1fr; } .manual-eligibility-modal .outcome-type-selector { flex-direction:column; } }
    .cb-filter input { height: 32px; font-size: 12px; flex: 1; }
    .cb-empty-group { padding: 12px 16px; font-size: 12px; color: var(--color-muted); }

<style>
/* ═══════════════════════════════════════════════════════════════
   Eligibility Studio redesign — landing page + questionnaire picker
   ═══════════════════════════════════════════════════════════════ */
:root {
  --elig-ink:#17202f;
  --elig-muted:#687386;
  --elig-line:#e5e8ee;
  --elig-soft:#f7f8fa;
  --elig-panel:#ffffff;
  --elig-brand:#c48a22;
  --elig-brand-soft:#fff6df;
  --elig-navy:#142033;
  --elig-green:#198754;
}

#main-content { background:#f4f6f8; }
.page-inner { max-width:1480px; }
.page-header {
  margin-bottom:18px;
  padding-bottom:18px;
  border-bottom:1px solid var(--elig-line);
}
.page-title { letter-spacing:-.4px; }
.page-subtitle { max-width:760px; }
.page-header-actions { gap:8px; flex-wrap:wrap; }
.page-header-actions .btn { border-radius:8px; }
.page-header-actions .btn-primary { box-shadow:0 4px 12px rgba(196,138,34,.18); }

.studio-context-bar {
  min-height:46px;
  padding:7px 12px;
  border:1px solid var(--elig-line);
  border-radius:10px;
  background:#fff;
  box-shadow:0 2px 8px rgba(20,32,51,.04);
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:16px;
}
.studio-context-pill { background:#eef2f7!important; color:#334155!important; border:1px solid #dce2ea; border-radius:999px!important; padding:5px 9px!important; font-weight:650; }
.cs-stat { background:#fff; border:1px solid var(--elig-line); border-radius:999px; padding:5px 9px; }

.eligibility-hero {
  display:flex;
  justify-content:space-between;
  gap:24px;
  align-items:stretch;
  padding:24px 26px;
  margin:0 0 18px;
  border:1px solid #dfe4eb;
  border-radius:14px;
  background:linear-gradient(135deg,#fff 0%,#fafbfc 65%,#f4f0e7 100%);
  box-shadow:0 6px 18px rgba(20,32,51,.05);
}
.eligibility-hero-copy { max-width:820px; }
.eligibility-eyebrow { font-size:10px; letter-spacing:1.2px; font-weight:800; color:var(--elig-brand); margin-bottom:8px; }
.eligibility-hero h2 { margin:0; font-size:25px; line-height:1.18; letter-spacing:-.5px; color:var(--elig-ink); }
.eligibility-hero p { margin:8px 0 15px; color:var(--elig-muted); font-size:13px; line-height:1.55; max-width:700px; }
.eligibility-flow-mini { display:flex; align-items:center; flex-wrap:wrap; gap:7px; font-size:11px; color:#64748b; }
.eligibility-flow-mini span { padding:6px 9px; border:1px solid #dfe4eb; border-radius:7px; background:#fff; }
.eligibility-flow-mini .current { color:#9a6813; border-color:#e9ca86; background:#fff8e9; font-weight:700; }
.eligibility-flow-mini b { color:#a7afbc; }
.eligibility-hero-action { min-width:245px; align-self:center; display:flex; align-items:center; gap:12px; padding:14px; border:1px solid #e4e7ec; border-radius:10px; background:#fff; }
.eligibility-hero-action strong { display:block; font-size:13px; color:var(--elig-ink); }
.eligibility-hero-action span { display:block; margin-top:3px; font-size:11px; line-height:1.4; color:var(--elig-muted); }
.eligibility-hero-icon { width:34px; height:34px; border-radius:9px; display:grid; place-items:center; background:#edf8f1; color:var(--elig-green); font-weight:800; }

/* Studio hub surfaces */
#studio-hub { min-width:0; }
#studio-hub > * { border-radius:12px; }
#studio-hub .card, #studio-hub .section-card, #studio-hub .cs-card { border-color:var(--elig-line); box-shadow:0 3px 12px rgba(20,32,51,.035); }

<script>
/* ═══════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════ */
const RULES = [];

const OPERATORS = ['=','≠','<','≤','>','≥','IN','NOT IN','CONTAINS','NOT CONTAINS','IS EMPTY','IS NOT EMPTY'];
const RISK_GROUP_ORDER = ['Operations','Fleet','Vehicle','Driver','Commodity','Safety','Loss History','Policy Administration','Claims','Renewal'];
let eligAttrSearch = '';
let eligAvailName = '';
let eligAvailGroup = '';
let eligAvailType = '';
let eligAvailEligible = 'available';
let pendingEligibilityRule = null;
const ELIGIBILITY_RULE_TEMPLATE = {
  id: 'ELG-TPL',
  name: 'New Rule',
  status: 'active',
  category: 'Product Eligibility',
  cover: 'All Covers',
  priority: 10,
  description: '',
  direction: 'ineligible',
  conditions: [{ attributeId: '', sourceQuestionId: '', field: '', op: '<', value: '', connector: 'AND' }],
  logic: 'and',
  outcomeType: 'hard',
  reasonCode: 'ELIG-NEW',
  customerMsg: 'This risk does not meet eligibility requirements for this product.',
  internalMsg: 'Eligibility rule triggered.',
  logAudit: true,
  scopes: { product: 'This product', version: '—', covers: ['All Covers'], segments: ['All Segments'], channels: ['All Channels'], jurisdictions: ['All configured jurisdictions'] },
  coverIds: [],
  overrideEffective: false,
  effectiveFrom: '—',
  effectiveTo: '—'
};

function eligOperators() { return (PS.admin && PS.admin.options('eligibilityOperators')) || OPERATORS; }

function productQuestionGroups() {
  const app = PS.prototypeApp;
  const pid = productId || app?.context?.()?.productId;
  const ver = productVersion || app?.context?.()?.version;
  if (!pid || !app?.getProductBundle) return [];
  return app.getProductBundle(pid, ver).questionGroups || [];
}

function productRiskAttributes() {
  const app = PS.prototypeApp;
  const pid = productId || app?.context?.()?.productId;
  const ver = productVersion || app?.context?.()?.version;
  if (!pid || !app?.getProductBundle) return [];
  return app.getProductBundle(pid, ver).risk || [];
}

function findQuestionById(qid) {
  if (!qid) return null;
  const id = String(qid);
  for (const group of productQuestionGroups()) {
    const q = (group.questions || []).find(item => item && String(item.id) === id);
    if (q) return { q, group };
  }
  return null;
}

function questionCategoryOf(q) {
  return String(q?.questionCategory || q?.category || 'general').toLowerCase().replace(/[^a-z]/g, '');
}

function riskDataType(attr, question) {
  const raw = String(attr?.type || attr?.dataType || question?.type || question?.fieldType || 'text').toLowerCase();
  if (raw.includes('multi')) return 'multi-select';
  if (raw.includes('select') || raw.includes('dropdown')) return 'select';
  if (raw.includes('bool') || raw.includes('yes')) return 'boolean';
  if (raw.includes('curren') || raw.includes('money') || raw.includes('amount')) return 'currency';
  if (raw.includes('date')) return 'date';
  if (raw.includes('num') || raw.includes('int') || raw.includes('decim') || raw.includes('year') || raw.includes('age')) return 'number';
  return 'text';
}

function slugField(s) {
  return String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}

function compiledAttrToken(attr, question) {
  const name = question?.label || attr?.name || attr?.label || attr?.id || '';
  return String(name).trim().toLowerCase().replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '') || slugField(name);
}

function riskAttributeFieldKey(risk) {
  if (PS.prototypeApp?.riskAttributeFieldKey) return PS.prototypeApp.riskAttributeFieldKey(risk);
  if (!risk) return '';
  return risk.fieldKey || slugField(risk.name || risk.label || risk.id);
}

function attrMarkedForEligibility(attr) {
  if (!attr) return false;
  if (attr.availableForEligibility === true) return true;
  return Array.isArray(attr.usedBy) && attr.usedBy.includes('eligibility');
}

function isAttrAvailableForNewRules(attr) {
  if (!attr) return false;
  if (!attrMarkedForEligibility(attr)) return false;
  if (attr.sourceStale) return false;
  const status = String(attr.status || 'active').toLowerCase();
  if (status === 'inactive' || status === 'disabled') return false;
  const found = findQuestionById(attr.questionId || attr.sourceQuestionId);
  if (found?.q && questionCategoryOf(found.q) !== 'risk') return false;
  return true;
}

function allRiskAttrsIndexed() {
  return productRiskAttributes();
}

function eligibilityRiskAttributes() {
  return allRiskAttrsIndexed().filter(isAttrAvailableForNewRules);
}

function findRiskAttr(idOrKey) {
  if (!idOrKey) return null;
  const key = String(idOrKey);
  const list = allRiskAttrsIndexed();
  return list.find(a => a.id === key || a.code === key || riskAttributeFieldKey(a) === key || compiledAttrToken(a) === key)
    || eligibilityRiskAttributes().find(a => a.id === key);
}

function resolveConditionAttr(c) {
  if (!c) return null;
  return findRiskAttr(c.attributeId)
    || findRiskAttr(c.sourceQuestionId)
    || findRiskAttr(c.field)
    || allRiskAttrsIndexed().find(a => (a.questionId || a.sourceQuestionId) === c.sourceQuestionId)
    || allRiskAttrsIndexed().find(a => slugField(a.name) === slugField(c.field));
}

function conditionIsUnavailable(c) {
  const attr = resolveConditionAttr(c);
  const linkedQuestion = c?.sourceQuestionId ? findQuestionById(c.sourceQuestionId) : null;
  if (!attr && linkedQuestion?.q) return false;
  if (!attr) return !!(c.attributeId || c.field);
  const status = String(attr.status || 'active').toLowerCase();
  if (status === 'inactive' || status === 'disabled' || attr.sourceStale) return true;
  const found = findQuestionById(attr.questionId || attr.sourceQuestionId || c.sourceQuestionId);
  if (found?.q && questionCategoryOf(found.q) !== 'risk') return true;
  if (c.sourceQuestionId && !found) return true;
  if (!attrMarkedForEligibility(attr)) return true;
  return false;
}

function operatorsForType(type) {
  if (type === 'number' || type === 'currency') return ['=', '≠', '>', '≥', '<', '≤', 'Between'];
  if (type === 'date') return ['Before', 'After', 'On', 'Between'];
  if (type === 'boolean') return ['Is True', 'Is False'];
  if (type === 'select') return ['=', '≠', 'IN', 'NOT IN'];
  if (type === 'multi-select') return ['Contains', 'Does Not Contain', 'Contains Any', 'Contains All'];
  return ['=', '≠', 'Contains', 'Starts with', 'Ends with'];
}

function opNeedsValue(op) {
  const o = String(op || '').toLowerCase();
  return o !== 'is empty' && o !== 'is blank' && o !== 'is not empty' && o !== 'is not blank' && o !== 'is true' && o !== 'is false';
}

function opNeedsTwoValues(op) {
  return String(op || '').toLowerCase() === 'between';
}

function normalizeOp(op) {
  const o = String(op || '');
  const map = {
    '=': '=', 'equals': '=',
    '!=': '≠', '≠': '≠', 'not equals': '≠',
    '<': '<', 'less than': '<',
    '<=': '≤', '≤': '≤', 'less than or equal': '≤',
    '>': '>', 'greater than': '>',
    '>=': '≥', '≥': '≥', 'greater than or equal': '≥',
    'in': 'IN', 'not in': 'NOT IN',
    'contains any': 'Contains Any', 'contains all': 'Contains All',
    'contains': 'Contains', 'does not contain': 'Does Not Contain', 'not contains': 'Does Not Contain',
    'is blank': 'IS EMPTY', 'is empty': 'IS EMPTY', 'is not blank': 'IS NOT EMPTY', 'is not empty': 'IS NOT EMPTY',
    'is true': 'Is True', 'is false': 'Is False', 'is': 'Is True', 'is not': 'Is False',
    'starts with': 'Starts with', 'ends with': 'Ends with',
    'before': 'Before', 'after': 'After', 'on': 'On', 'before or on': 'Before or On', 'after or on': 'After or On',
    'between': 'Between'
  };
  return map[o.toLowerCase()] || o;
}

function normalizeOptionList(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) {
    return raw.map(o => {
      if (o && typeof o === 'object') return { value: String(o.value != null ? o.value : o.label || o), label: String(o.label || o.value || o) };
      return { value: String(o), label: String(o) };
    }).filter(o => o.value);
  }
  return String(raw).split(/[\n,;]/).map(s => s.trim()).filter(Boolean).map(s => ({ value: s, label: s }));
}

function questionOptions(attr, question) {
  const q = question || findQuestionById(attr?.questionId || attr?.sourceQuestionId)?.q;
  const fromAttr = normalizeOptionList(attr?.options || attr?.optionList || attr?.selectOptions || attr?.values);
  if (fromAttr.length) return fromAttr;
  const fromQ = normalizeOptionList(q?.options);
  if (fromQ.length) return fromQ;
  if (attr?.optionRisk && typeof attr.optionRisk === 'object') {
    return Object.keys(attr.optionRisk).map(k => ({ value: k, label: k }));
  }
  return [];
}

function emptyCondition() {
  return { attributeId: '', sourceQuestionId: '', field: '', op: '', value: '', value2: '', connector: 'AND' };
}

function normalizeCondition(c) {
  const raw = c && typeof c === 'object' ? c : {};
  const attr = resolveConditionAttr(raw);
  const found = findQuestionById(raw.sourceQuestionId || attr?.questionId || attr?.sourceQuestionId);
  const attributeId = raw.attributeId || attr?.id || '';
  const sourceQuestionId = raw.sourceQuestionId || attr?.questionId || attr?.sourceQuestionId || '';
  const field = raw.field || (attr ? riskAttributeFieldKey(attr) : '');
  return {
    attributeId,
    sourceQuestionId,
    field,
    op: normalizeOp(raw.op || ''),
    value: raw.value != null ? String(raw.value) : '',
    value2: raw.value2 != null ? String(raw.value2) : '',
    connector: raw.connector || 'AND'
  };
}

function attrGroupLabel(a) {
  const found = findQuestionById(a.questionId || a.sourceQuestionId);
  return a.questionGroup || a.category || found?.group?.label || found?.group?.name || 'Other';
}

function eligGroupFilterSelectHtml() {
  const selected = eligAttrSearch;
  const groups = [...new Set(eligibilityRiskAttributes().map(attrGroupLabel))].sort((a, b) => {
    const ia = RISK_GROUP_ORDER.indexOf(a);
    const ib = RISK_GROUP_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  return `<select class="form-control" style="max-width:240px;height:32px" onchange="filterEligAttrSearch(this.value)" aria-label="Filter Risk Attribute group">
    <option value="">All Groups</option>
    ${groups.map(g => `<option value="${htmlEsc(g)}" ${String(selected).toLowerCase() === g.toLowerCase() ? 'selected' : ''}>${htmlEsc(g)}</option>`).join('')}
  </select>`;
}
function groupedAttrOptionsHtml(selectedId, includeAttr, search) {
  const available = eligibilityRiskAttributes();
  const extra = includeAttr && !available.some(a => a.id === includeAttr.id) ? [includeAttr] : [];
  let list = [...available, ...extra];
  const q = String(search || eligAttrSearch || '').trim().toLowerCase();
  if (q) {
    list = list.filter(a => {
      const found = findQuestionById(a.questionId || a.sourceQuestionId);
      const name = String(found?.q?.label || a.name || a.id).toLowerCase();
      const group = String(attrGroupLabel(a)).toLowerCase();
      return name.includes(q) || group.includes(q) || String(a.id).toLowerCase().includes(q);
    });
  }
  if (!list.length) {
    if (q) return `<option value="">No Risk Attributes configured for ${htmlEsc(search || eligAttrSearch)}</option>`;
    return `<option value="">Select Risk Attribute...</option>`;
  }
  const groups = new Map();
  list.forEach(a => {
    const label = attrGroupLabel(a);
    if (!groups.has(label)) groups.set(label, []);
    groups.get(label).push(a);
  });
  const ordered = [...groups.keys()].sort((a, b) => {
    const ia = RISK_GROUP_ORDER.indexOf(a);
    const ib = RISK_GROUP_ORDER.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
  });
  let html = `<option value="">Select Risk Attribute...</option>`;
  ordered.forEach(label => {
    html += `<optgroup label="${htmlEsc(label)}">`;
    groups.get(label).forEach(a => {
      const found = findQuestionById(a.questionId || a.sourceQuestionId);
      const name = found?.q?.label || a.name || a.id;
      html += `<option value="${htmlEsc(a.id)}" ${a.id === selectedId ? 'selected' : ''}>${htmlEsc(name)}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}

function conditionValueControl(c, i, ro) {
  const attr = resolveConditionAttr(c);
  const found = findQuestionById(c.sourceQuestionId || attr?.questionId);
  const type = riskDataType(attr, found?.q);
  const op = normalizeOp(c.op);
  const rd = ro ? 'disabled' : '';
  if (!opNeedsValue(op)) {
    return `<input type="text" class="form-control cb-value" value="" disabled placeholder="Not required">`;
  }
  if (opNeedsTwoValues(op)) {
    return `<span style="display:flex;gap:8px;flex:1;min-width:180px">
      <input type="number" class="form-control" data-el-validate="cond-val-${i}" value="${htmlEsc(c.value || '')}" ${ro ? 'readonly' : ''} placeholder="From" oninput="patchRuleCondition(${i}, 'value', this.value); clearEligFieldError(this)">
      <input type="number" class="form-control" data-el-validate="cond-val2-${i}" value="${htmlEsc(c.value2 || '')}" ${ro ? 'readonly' : ''} placeholder="To" oninput="patchRuleCondition(${i}, 'value2', this.value); clearEligFieldError(this)">
    </span>`;
  }
  if (type === 'boolean') {
    const v = String(c.value || '');
    return `<select class="form-control cb-value" data-el-validate="cond-val-${i}" ${rd} onchange="patchRuleCondition(${i}, 'value', this.value); clearEligFieldError(this)">
      <option value="">Select</option>
      <option value="Yes" ${v === 'Yes' || v === 'true' || v === '1' ? 'selected' : ''}>Yes</option>
      <option value="No" ${v === 'No' || v === 'false' || v === '0' ? 'selected' : ''}>No</option>
    </select>`;
  }
  const opts = questionOptions(attr, found?.q);
  if ((type === 'select' || type === 'multi-select' || op === 'IN' || op === 'NOT IN') && opts.length) {
    if (op === 'IN' || op === 'NOT IN' || type === 'multi-select') {
      const selected = String(c.value || '').split(',').map(s => s.trim()).filter(Boolean);
      return `<select class="form-control cb-value" multiple data-el-validate="cond-val-${i}" ${rd} onchange="patchRuleCondition(${i}, 'value', Array.from(this.selectedOptions).map(o=>o.value).join(', ')); clearEligFieldError(this)">
        ${opts.map(o => `<option value="${htmlEsc(o.value)}" ${selected.includes(o.value) || selected.includes(o.label) ? 'selected' : ''}>${htmlEsc(o.label)}</option>`).join('')}
      </select>`;
    }
    return `<select class="form-control cb-value" data-el-validate="cond-val-${i}" ${rd} onchange="patchRuleCondition(${i}, 'value', this.value); clearEligFieldError(this)">
      <option value="">Select</option>
      ${opts.map(o => `<option value="${htmlEsc(o.value)}" ${String(c.value) === o.value || String(c.value) === o.label ? 'selected' : ''}>${htmlEsc(o.label)}</option>`).join('')}
    </select>`;
  }
  if (type === 'date') {
    return `<input type="date" class="form-control cb-value" data-el-validate="cond-val-${i}" value="${htmlEsc(c.value || '')}" ${ro ? 'readonly' : ''} oninput="patchRuleCondition(${i}, 'value', this.value); clearEligFieldError(this)">`;
  }
  if (type === 'number' || type === 'currency') {
    return `<input type="number" step="${type === 'currency' ? '0.01' : 'any'}" class="form-control cb-value" data-el-validate="cond-val-${i}" value="${htmlEsc(c.value || '')}" ${ro ? 'readonly' : ''} placeholder="${type === 'currency' ? 'Enter amount' : 'Enter number'}" oninput="patchRuleCondition(${i}, 'value', this.value); clearEligFieldError(this)">`;
  }
  return `<input type="text" class="form-control cb-value" data-el-validate="cond-val-${i}" value="${htmlEsc(c.value || '')}" ${ro ? 'readonly' : ''} placeholder="Enter value" oninput="patchRuleCondition(${i}, 'value', this.value); clearEligFieldError(this)">`;
}

function compileConditionLine(c) {
  const attr = resolveConditionAttr(c);
  const found = findQuestionById(c.sourceQuestionId || attr?.questionId);
  const token = found?.q?.label || attr?.name || c.field || '—';
  const op = normalizeOp(c.op) || '?';
  if (!opNeedsValue(op)) return `${token} ${op}`;
  if (opNeedsTwoValues(op)) return `${token} Between ${c.value || '—'} and ${c.value2 || '—'}`;
  return `${token} ${op} ${c.value || '—'}`;
}

function conditionSourceHtml(c) {
  const attr = resolveConditionAttr(c);
  if (!attr && !c.attributeId) return '';
  if (conditionIsUnavailable(c) && attr) {
    const unmarked = !attrMarkedForEligibility(attr);
    const inactive = String(attr.status || '').toLowerCase() === 'inactive';
    const title = unmarked ? '⚠ Attribute no longer available' : (inactive ? 'Attribute inactive' : '⚠ Risk Attribute unavailable');

      ? `This rule references a Risk Attribute that is no longer available for Eligibility.`
      : `${htmlEsc(attr.name || c.field || 'This attribute')} needs review. Select a current eligible Risk Attribute.`;

  const qlabel = found?.q?.label || attr.questionLabel || attr.name;
  const group = attrGroupLabel(attr);
  const type = attr.type || riskDataType(attr, found?.q);
  return `<div class="cb-source">

    Attribute ID: ${htmlEsc(attr.id)} · Source: Questionnaire<br>

    Data Type: ${htmlEsc(type)} · Group: ${htmlEsc(group)}

function riskStudioHref() {
  return `risk-studio.html?product=${encodeURIComponent(productId || '')}&version=${encodeURIComponent(productVersion || '')}`;
}

function attrDisplayName(a) {
  const found = findQuestionById(a.questionId || a.sourceQuestionId);
  return found?.q?.label || a.questionLabel || a.name || a.label || a.id;
}

function attrDataTypeLabel(a) {
  const found = findQuestionById(a.questionId || a.sourceQuestionId);
  const t = riskDataType(a, found?.q);
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function isRiskCategoryAttr(attr) {
  if (!attr || attr.sourceStale) return false;
  const found = findQuestionById(attr.questionId || attr.sourceQuestionId);
  if (found?.q) return questionCategoryOf(found.q) === 'risk';
  return false;
}

function otherRiskAttributes() {
  return allRiskAttrsIndexed().filter(a => isRiskCategoryAttr(a) && !attrMarkedForEligibility(a));
}

function eligNavGroups() {
  const order = RISK_GROUP_ORDER.slice();
  const extra = new Set();
  allRiskAttrsIndexed().forEach(a => {
    const g = attrGroupLabel(a);
    if (g && !order.includes(g)) extra.add(g);
  });
  return order.concat([...extra]);
}

function countEligInGroup(group) {
  const g = String(group || '').toLowerCase();
  return eligibilityRiskAttributes().filter(a => String(attrGroupLabel(a)).toLowerCase() === g).length;
}

function selectEligAvailGroup(group) {
  eligAvailGroup = group || '';
  renderAvailableRiskAttributesPanel();
}

function configureRuleFromAttribute(attributeId) {
  const id = String(attributeId || '').trim();
  if (!id) return;
  const attr = findRiskAttr(id);
  if (!attr || !isAttrAvailableForNewRules(attr)) {
    notifyElig('Not available', 'This Risk Attribute is not available for Eligibility. Enable “Available for Eligibility” in Risk Studio first.', 'error');
    return;
  }
  const existing = RULES.find(r => primaryLinkedAttributeId(normalizeEligibilityRule(r)) === id);
  if (existing) {
    if (!rulesCanEdit()) {
      openRuleEditor(existing.id);
      return;
    }
    openRuleEditor(existing.id);
    return;
  }
  if (!rulesCanEdit()) {
    notifyElig('Read-only', 'This published version cannot be edited.', 'error');
    return;
  }
  startEligibilityConfig(attr);
}
window.configureRuleFromAttribute = configureRuleFromAttribute;

document.addEventListener('click', function (event) {
  const hit = event.target && event.target.closest ? event.target.closest('[data-elig-configure]') : null;
  if (!hit) return;
  event.preventDefault();
  event.stopPropagation();
  configureRuleFromAttribute(hit.getAttribute('data-elig-configure'));
});

function primaryLinkedAttributeId(rule) {
  if (!rule) return '';
  if (rule.riskAttributeId) return rule.riskAttributeId;
  const c = (rule.conditions || [])[0];
  return c?.attributeId || '';
}

function currentRule() {
  if (pendingEligibilityRule && pendingEligibilityRule.id === activeRuleId) return pendingEligibilityRule;
  return RULES.find(r => r.id === activeRuleId) || pendingEligibilityRule;
}

function setEligHubVisible(show) {
  document.getElementById('elig-about')?.classList.toggle('hidden', !show);
  document.getElementById('elig-main-page')?.classList.toggle('hidden', !show);
}

function syncEligEditorQuery(ruleId, riskId) {
  try {
    const url = new URL(location.href);
    if (ruleId) url.searchParams.set('rule', ruleId);
    else url.searchParams.delete('rule');
    if (riskId) url.searchParams.set('risk', riskId);
    else url.searchParams.delete('risk');
    history.replaceState({}, '', url);
  } catch (e) {}
}

function sidebarRules() {
  const list = RULES.slice();
  if (pendingEligibilityRule && !list.some(r => r.id === pendingEligibilityRule.id)) {
    list.unshift(pendingEligibilityRule);
  }
  return list;
}

function formatEligDate(val) {
  const iso = isoDateValue(val);
  if (!iso) return String(val || '—');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const [y, m, d] = iso.split('-');
  return `${d}-${months[Number(m) - 1] || m}-${y}`;
}

function startEligibilityConfig(attr) {
  const dates = defaultEffectiveDates();
  const id = nextEligibilityRuleId();
  const name = `${attrDisplayName(attr)} Eligibility`;
  pendingEligibilityRule = normalizeEligibilityRule({
    id,
    name,
    category: 'Product Eligibility',
    cover: 'All Covers',
    coverIds: [],
    priority: 10,
    status: 'active',
    description: '',
    riskAttributeId: attr.id,
    source: 'Product',
    lastUpdated: new Date().toISOString().slice(0, 10),
    reasonCode: id.replace(/^ELG-/, 'ELG-'),
    conditions: [conditionFromAttributeId(attr.id)],
    outcomeType: 'refer',
    logic: 'and',
    logAudit: true,
    effectiveFrom: dates.from,
    effectiveTo: dates.to,
    scopes: {
      product: productName || PS.studioHub?.productName || 'This product',
      version: productVersion ? `v${productVersion}` : '—',
      covers: ['All Covers'],
      segments: ['All Segments'],
      channels: ['All Channels']
    }
  });
  pendingEligibilityRule.reasonCode = id;
  activeRuleId = id;
  if (PS.studioHub?.setActiveId) PS.studioHub.setActiveId(id);
  syncEligEditorQuery(id, attr.id);
  renderRuleList();
  enterEligibilityEditor(id);
}

function enterEligibilityEditor(id) {
  if (id) activeRuleId = id;
  if (PS.studioHub?.setActiveId) PS.studioHub.setActiveId(activeRuleId);
  setEligHubVisible(false);
  document.getElementById('studio-hub')?.classList.add('hidden');
  document.getElementById('studio-editor')?.classList.remove('hidden');
  if (PS.studioHub) PS.studioHub.mode = 'edit';
  renderRuleList();
  loadRule(activeRuleId);
  const backBtn = document.querySelector('#studio-editor .cs-back button');
  if (backBtn) {
    backBtn.textContent = '← Back to Eligibility Studio';
    backBtn.setAttribute('onclick', 'backToEligHub()');
  }
  document.getElementById('studio-editor')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function backToEligHub() {
  pendingEligibilityRule = null;
  syncEligEditorQuery('', '');
  setEligHubVisible(true);
  if (PS.studioHub?.showHub) PS.studioHub.showHub();
  renderAvailableRiskAttributesPanel();
  PS.studioHub?.paint?.();
}

function commitPendingEligibilityRule() {
  if (!pendingEligibilityRule) return true;
  const attr = findRiskAttr(pendingEligibilityRule.riskAttributeId || primaryLinkedAttributeId(pendingEligibilityRule));
  if (!attr || !isAttrAvailableForNewRules(attr)) {
    notifyElig('Cannot save', 'This Risk Attribute is no longer available for Eligibility. Update the configuration in Risk Studio.', 'error');
    return false;
  }
  if (!RULES.some(r => r.id === pendingEligibilityRule.id)) RULES.push(pendingEligibilityRule);
  pendingEligibilityRule = null;
  persistRules();
  return true;
}

function conditionFromAttributeId(attributeId) {

function filteredAvailableRiskAttributes() {

}

              <td style="font-family:'IBM Plex Mono',monospace;font-size:12px">${htmlEsc(a.id)}</td>

function eligAttributes() {
  const ids = eligibilityRiskAttributes().map(a => a.id);
  return ids.length ? ids : [];
}

function normalizeRuleStatus(status) {
  const s = String(status || '').toLowerCase();
  if (s === 'inactive' || s === 'disabled' || s === 'off') return 'inactive';
  if (s === 'warning' || s === 'conflict') return 'warning';
  return 'active';
}

function isPlaceholderDate(val) {
  const v = String(val || '').trim();
  return !v || v === '—' || v === '-';
}

function isoDateValue(val) {
  const s = String(val || '').trim();
  if (!s || s === '—' || s === '-') return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const t = Date.parse(s.replace(/-/g, ' '));
  if (Number.isNaN(t)) return '';
  const d = new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function defaultEffectiveDates() {
  const hub = PS.studioHub;
  const ver = hub?.productVersion || productVersion || '2026.04';
  const y = String(ver).split('.')[0] || '2026';
  return { from: `${y}-04-01`, to: `${y}-09-30` };
}

function seedRuleById(id) {
  return (typeof DEFAULT_ELIGIBILITY_RULES !== 'undefined' ? DEFAULT_ELIGIBILITY_RULES : []).find(r => r.id === id);
}

function enrichRuleFromSeed(rule) {
  const seed = seedRuleById(rule?.id);
  const merged = seed ? Object.assign({}, seed, rule) : (rule || {});
  const dates = defaultEffectiveDates();
  if (isPlaceholderDate(merged.effectiveFrom)) merged.effectiveFrom = seed?.effectiveFrom || dates.from;
  if (isPlaceholderDate(merged.effectiveTo)) merged.effectiveTo = seed?.effectiveTo || dates.to;
  if (!Array.isArray(merged.conditions) || !merged.conditions.length) {
    merged.conditions = (seed?.conditions || []).map(normalizeCondition);
    if (!merged.conditions.length) merged.conditions = [emptyCondition()];
  } else {
    merged.conditions = merged.conditions.map(normalizeCondition);
  }
  if (!merged.reasonCode || merged.reasonCode === 'ELIG-NEW') merged.reasonCode = seed?.reasonCode || merged.reasonCode;
  if (!merged.customerMsg) merged.customerMsg = seed?.customerMsg || ELIGIBILITY_RULE_TEMPLATE.customerMsg;
  return merged;
}

function normalizeEligibilityRule(rule) {
  const r = enrichRuleFromSeed(rule);
  const hub = PS.studioHub;
  const tpl = ELIGIBILITY_RULE_TEMPLATE;
  const scopesIn = r.scopes && typeof r.scopes === 'object' ? r.scopes : {};
  const dates = defaultEffectiveDates();
  return Object.assign({}, tpl, r, {
    name: r.name || r.label || tpl.name,
    category: r.category || tpl.category,
    status: normalizeRuleStatus(r.status),
    cover: r.cover || tpl.cover,
    priority: r.priority != null ? r.priority : tpl.priority,
    description: r.description || r.desc || tpl.description,
    direction: r.direction || tpl.direction,
    logic: r.logic || tpl.logic,
    conditions: Array.isArray(r.conditions) && r.conditions.length ? r.conditions.map(normalizeCondition) : [emptyCondition()],
    outcomeType: r.outcomeType || tpl.outcomeType,
    reasonCode: r.reasonCode || tpl.reasonCode,
    customerMsg: r.customerMsg || tpl.customerMsg,
    internalMsg: r.internalMsg || tpl.internalMsg,
    logAudit: r.logAudit !== false,
    effectiveFrom: isPlaceholderDate(r.effectiveFrom) ? dates.from : r.effectiveFrom,
    effectiveTo: isPlaceholderDate(r.effectiveTo) ? dates.to : r.effectiveTo,
    riskAttributeId: r.riskAttributeId || (Array.isArray(r.conditions) && r.conditions[0]?.attributeId) || '',
    overrideEffective: !!r.overrideEffective,
    scopes: {
      product: scopesIn.product || hub?.productName || tpl.scopes.product,
      version: scopesIn.version || (hub?.productVersion ? `v${hub.productVersion}` : tpl.scopes.version),
      covers: Array.isArray(scopesIn.covers) && scopesIn.covers.length ? scopesIn.covers : tpl.scopes.covers.slice(),

function isRuleIncomplete(r) {
  const rule = normalizeEligibilityRule(r);
  if (!String(rule.name || '').trim() || !String(rule.category || '').trim()) return true;
  if (!Number.isFinite(Number(rule.priority)) || Number(rule.priority) <= 0) return true;
  if (!rule.outcomeType) return true;
  if (!String(rule.reasonCode || '').trim()) return true;
  if (!String(rule.internalMsg || '').trim()) return true;
  if ((rule.outcomeType === 'hard' || rule.outcomeType === 'soft') && !String(rule.customerMsg || '').trim()) return true;
  const conditions = rule.conditions || [];
  if (!conditions.length) return true;
  return conditions.some(c => {
    if (!c.attributeId && !c.field) return true;
    if (conditionIsUnavailable(c)) return true;
    if (!c.op) return true;
    if (opNeedsValue(c.op) && String(c.value || '').trim() === '') return true;
    if (opNeedsTwoValues(c.op) && String(c.value2 || '').trim() === '') return true;
    return false;
  });
}

function conditionSignature(c) {
  const n = normalizeCondition(c);
  return [n.attributeId || n.field, normalizeOp(n.op), String(n.value || '').trim()].join('|');
}

function detectConflicts() {
  const out = [];
  RULES.map(normalizeEligibilityRule).forEach(r => {
    (r.conditions || []).forEach(c => {
      if (conditionIsUnavailable(c)) {
        const attr = resolveConditionAttr(c);
        out.push({
          label: `Linked Risk Attribute is no longer available for Eligibility${attr ? ': ' + (attr.name || attr.id) : ''}`,
          rules: [r.id],
          type: 'Conflict',
          severity: 'Warning'
        });
      }
    });
  });
  const active = RULES.map(normalizeEligibilityRule).filter(r => r.status === 'active');
  const seenDup = new Set();
  active.forEach((a, i) => {
    active.forEach((b, j) => {
      if (j <= i) return;
      const sameScope = String(a.cover || '') === String(b.cover || '') && String(a.category || '') === String(b.category || '');
      if (!sameScope) return;
      const sigA = (a.conditions || []).map(conditionSignature).sort().join('&&');
      const sigB = (b.conditions || []).map(conditionSignature).sort().join('&&');
      if (sigA && sigA === sigB) {
        const key = [a.id, b.id].sort().join(':');
        if (!seenDup.has(key)) {
          seenDup.add(key);
          const conflictOutcome = a.outcomeType !== b.outcomeType;
          out.push({
            label: conflictOutcome
              ? `Conflict: ${a.name} and ${b.name} use the same conditions with different outcomes (${outcomeLabel(a.outcomeType)} vs ${outcomeLabel(b.outcomeType)})`
              : `Duplicate conditions: ${a.name} / ${b.name}`,
            rules: [a.id, b.id],
            type: conflictOutcome ? 'Conflict' : 'Duplicate',
            severity: conflictOutcome ? 'Warning' : 'Warning'
          });
        }
      }
      if (a.outcomeType !== 'hard' || b.outcomeType !== 'hard') return;
      (a.conditions || []).forEach(ca => {
        (b.conditions || []).forEach(cb => {
          const ida = ca.attributeId || ca.field;
          const idb = cb.attributeId || cb.field;
          if (!ida || ida !== idb) return;
          const oa = normalizeOp(ca.op);
          const ob = normalizeOp(cb.op);
          const na = Number(ca.value);
          const nb = Number(cb.value);
          if (Number.isNaN(na) || Number.isNaN(nb)) return;
          const pair = ['<', '≤', 'Less Than', 'Less Than or Equal'].includes(oa) && ['<', '≤', 'Less Than', 'Less Than or Equal'].includes(ob) && na !== nb;
          const pair2 = ['>', '≥', 'Greater Than', 'Greater Than or Equal'].includes(oa) && ['>', '≥', 'Greater Than', 'Greater Than or Equal'].includes(ob) && na !== nb;
          const opposite = ((['≥', '>', '=', 'Greater Than', 'Greater Than or Equal', 'Equals'].includes(oa) && ['<', '≤', 'Less Than', 'Less Than or Equal'].includes(ob)) || (['≥', '>', '=', 'Greater Than', 'Greater Than or Equal', 'Equals'].includes(ob) && ['<', '≤', 'Less Than', 'Less Than or Equal'].includes(oa)));
          if (pair || pair2 || opposite) {
            out.push({
              label: `${a.name} and ${b.name} both hard-block overlapping thresholds on the same Risk Attribute`,
              rules: [a.id, b.id],
              type: 'Overlapping threshold',
              severity: 'Warning'
            });
          }
        });
      });
    });
  });
  return out;
}

function productCovers() {
  syncEligProductContext();
  const app = window.PS?.prototypeApp;
  const pid = productId;
  const byKey = new Map();
  const addList = (list) => {
    (Array.isArray(list) ? list : []).forEach(c => {
      if (!c || typeof c !== 'object') return;
      const id = String(c.id || '').trim();
      const key = id || c.code || c.name;
      if (!key || byKey.has(key)) return;
      byKey.set(key, c);
    });
  };
  const collections = app?.state?.collections || {};
  if (pid) {
    Object.keys(collections).forEach(k => {
      if (k.startsWith(`${pid}::`) && k.endsWith('::covers')) addList(collections[k]);
    });
  }
  productCoverVersionCandidates().forEach(ver => addList(app?.getProductBundle?.(pid, ver)?.covers));
  if (!byKey.size) return [];
  return Array.from(byKey.values());
}

function patchRuleCover(coverId, on) {
  if (!rulesCanEdit()) return;

  else rule.coverIds = rule.coverIds.filter(id => id !== coverId);
  const covers = productCovers();
  const picked = covers.filter(c => rule.coverIds.includes(c.id) || rule.coverIds.includes(c.code));
  rule.cover = picked.length === 1 ? (picked[0].name || picked[0].code) : (picked.length ? `${picked.length} covers` : 'All Covers');
  if (rule.scopes) rule.scopes.covers = picked.length ? picked.map(c => c.name || c.code) : ['All Covers'];

function patchRuleCondition(i, key, value) {
  if (!rulesCanEdit()) return;
  const rule = currentRule();
  if (!rule || !rule.conditions[i]) return;
  rule.conditions[i][key] = value;
  persistRules();
  if (key !== 'value') loadRule(activeRuleId);
}

function patchRuleConditionAttr(i, attributeId) {
  if (!rulesCanEdit()) return;
  const rule = currentRule();
  if (!rule || !rule.conditions[i]) return;
  if (i === 0 && primaryLinkedAttributeId(rule)) return;
  const attr = findRiskAttr(attributeId);
  const found = findQuestionById(attr?.questionId || attr?.sourceQuestionId);
  const type = riskDataType(attr, found?.q);
  const ops = operatorsForType(type);
  rule.conditions[i].attributeId = attributeId;
  rule.conditions[i].sourceQuestionId = attr?.questionId || attr?.sourceQuestionId || '';
  rule.conditions[i].field = attr ? riskAttributeFieldKey(attr) : '';
  rule.conditions[i].op = ops[0] || '';
  rule.conditions[i].value = '';
  rule.conditions[i].value2 = '';
  persistRules();
  loadRule(activeRuleId);
}


function eligibilityConditionRowHtml(c, i, lockedId, ro, dis) {
  const attr = resolveConditionAttr(c) || (i === 0 ? findRiskAttr(lockedId) : null);
  const found = findQuestionById(c.sourceQuestionId || attr?.questionId);
  const type = riskDataType(attr, found?.q);
  const ops = operatorsForType(type);
  const op = normalizeOp(c.op);
  const opList = op && !ops.includes(op) ? [op, ...ops] : ops;
  const lockFirst = i === 0 && !!lockedId;
  const unavailable = conditionIsUnavailable(c);
  const questionnaireQuestion = !attr && c.sourceQuestionId ? found?.q : null;
  const isQuestionLinked = !!questionnaireQuestion;

  return `

    ${unavailable && attr
      ? `<div class="attr-warn">

            Resolve in Risk Studio

        </div>`
      : isQuestionLinked
        ? `<div class="cb-source" style="margin:0 0 8px"><strong>Questionnaire:</strong> ${htmlEsc(questionnaireQuestion.label || questionnaireQuestion.id)} · ${htmlEsc(questionnaireQuestion.id)}</div>`
        : ''}

    <div class="cb-row" data-condition-index="${i}">

          ? `<input

               class="form-control cs-readonly-field"
               data-el-validate="cond-attr-${i}"
               value="${htmlEsc(questionnaireQuestion.label || questionnaireQuestion.id)}"
               readonly>`
          : lockFirst
            ? `<input
                 type="text"
                 class="form-control cs-readonly-field"
                 data-el-validate="cond-attr-${i}"
                 value="${htmlEsc(attrDisplayName(attr || {}) || '')}"
                 readonly>`
            : `<select
                 class="form-control"
                 data-el-validate="cond-attr-${i}"
                 ${dis}
                 onchange="
                   patchRuleConditionAttr(${i}, this.value);
                   clearEligFieldError(this);

               >
                 ${groupedAttrOptionsHtml(c.attributeId || attr?.id || '', attr, '')}
               </select>`
      }

      <select
        class="form-control"

      >

          <option

      <div class="cb-value">
        ${conditionValueControl(c, i, ro)}

             </button>`

}


function addRuleCondition(connector) {
  if (!rulesCanEdit()) return;

  const rule = currentRule();
  if (!rule) return;

  if (!Array.isArray(rule.conditions)) {
    rule.conditions = [];
  }

  const linkedId = primaryLinkedAttributeId(rule);

  // Keep the first linked condition tied to the Risk Attribute.
  // Every additional condition starts empty and must be configured
  // through the same Risk Attribute / Operator / Value controls.
  const condition =
    rule.conditions.length === 0 && linkedId
      ? conditionFromAttributeId(linkedId)
      : emptyCondition();

  condition.connector = connector === 'OR' ? 'OR' : 'AND';
  rule.conditions.push(condition);

  persistRules();
  loadRule(activeRuleId);
}

function addRuleConditionGroup() {
  if (!rulesCanEdit()) return;

  const rule = currentRule();
  if (!rule) return;

  if (!Array.isArray(rule.conditions)) {
    rule.conditions = [];
  }

  const condition = emptyCondition();
  condition.connector = 'OR';

  rule.conditions.push(condition);

  persistRules();
  loadRule(activeRuleId);
}


function removeRuleCondition(i) {
  if (!rulesCanEdit()) return;
  const rule = currentRule();
  if (!rule) return;
  if ((rule.conditions || []).length <= 1) {
    notifyElig('Cannot remove', 'At least one condition is required.', 'error');
    return;
  }
  rule.conditions.splice(i, 1);
  persistRules();
  loadRule(activeRuleId);
}

function setRuleLogic(logic) {
  patchRule('logic', logic, { light: false });

function setOutcomeType(type) {
  patchRule('outcomeType', type, { light: false });
}

function toggleRuleStatus(on) {
  patchRule('status', on ? 'active' : 'inactive', { light: false });
}

function openRuleEditor(id) {
  if (typeof PS !== 'undefined' && PS.closeModal) PS.closeModal();
  if (id) activeRuleId = id;
  const rule = currentRule() || RULES.find(r => r.id === id);
  syncEligEditorQuery(id, primaryLinkedAttributeId(rule || {}));
  enterEligibilityEditor(id);
}

function openEligibilityEditorOnLoad() {
  ensureDefaultEligibilityRules();
  refreshEligibilityMeta();

  const params = new URLSearchParams(location.search);
  const deep = params.get('rule');
  const risk = params.get('risk');

  // Only open the editor when the URL explicitly asks for a rule
  // or a Risk Attribute configuration. Normal studio entry opens
  // directly on the Eligibility Studio hub with all rules visible.
  if (deep && (RULES.some(r => r.id === deep) || (pendingEligibilityRule && pendingEligibilityRule.id === deep)) && PS.studioHub) {
    PS.studioHub.open(deep);
    return;
  }

  if (risk) {
    configureRuleFromAttribute(risk);
    return;
  }

  // Default landing view: Eligibility Studio hub.
  activeRuleId = '';
  setEligHubVisible(true);
  document.getElementById('studio-hub')?.classList.remove('hidden');
  document.getElementById('studio-editor')?.classList.add('hidden');
  if (PS.studioHub) {
    PS.studioHub.mode = 'hub';
    PS.studioHub.showHub?.();
  }
  renderAvailableRiskAttributesPanel();
  refreshEligibilityMeta();
}

document.addEventListener('click', () => document.querySelectorAll('.cover-dd.open').forEach(el => el.classList.remove('open')));

function ruleListCondLine(r) {
  const rule = normalizeEligibilityRule(r);
  const logic = String(rule.logic || 'and').toUpperCase();
  const cond = (rule.conditions || []).map(compileConditionLine).join(` ${logic} `);
  if (!cond) return 'No conditions configured';
  const outcome = outcomeLabel(rule.outcomeType);
  return `${cond} · ${outcome}`;
}

function ruleStatusDotClass(r) {
  if (isRuleIncomplete(r)) return 'warning';
  if (r.status === 'inactive') return 'inactive';
  return 'active';
}

  const list = document.getElementById('rule-list');
  if (!list) return;
  ensureDefaultEligibilityRules();

  const listHTML = (rules) => rules.map(r => {

    const unsaved = pendingEligibilityRule && pendingEligibilityRule.id === rule.id && !RULES.some(x => x.id === rule.id);
    return `
    <div class="rule-item ${rule.id===activeRuleId?'active':''}" onclick="openRuleEditor('${rule.id}')" id="rule-item-${rule.id}">
      <span class="rule-status-dot ${dotCls}" title="${dotCls === 'active' ? 'Active' : dotCls === 'warning' ? 'Needs Attention' : 'Inactive'}"></span>
      <div class="rule-item-body">

        <div class="rule-item-meta">
          <span>${htmlEsc(formatEligDate(rule.effectiveFrom))} — ${htmlEsc(formatEligDate(rule.effectiveTo))}</span>
          ${rule.cover && rule.cover !== 'All Covers' ? `<span class="rule-cover-badge">${htmlEsc(rule.cover)}</span>` : ''}

  list.innerHTML = `
    <div class="rule-section-label">Product Eligibility</div>
    ${productRules.length ? listHTML(productRules) : `<div style="padding:12px 14px;font-size:12px;color:var(--color-muted)">No product-level rules yet.</div>`}

    ${variantRules.length ? listHTML(variantRules) : `<div style="padding:12px 14px;font-size:12px;color:var(--color-muted)">No renewal-level rules yet.</div>`}
    <button class="rule-add-btn" type="button" onclick="openAddRuleModal()">
      <svg width="12" height="12" viewBox="0 0 256 256" fill="none"><path d="M224 128a8 8 0 01-8 8h-80v80a8 8 0 01-16 0v-80H40a8 8 0 010-16h80V40a8 8 0 0116 0v80h80a8 8 0 018 8z" fill="currentColor"/></svg>

═══════════════════════════════════════════════ */
function loadRule(id) {
  if (id) activeRuleId = id;
  if (!activeRuleId && pendingEligibilityRule) activeRuleId = pendingEligibilityRule.id;
  document.querySelectorAll('.rule-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`rule-item-${activeRuleId}`)?.classList.add('active');
  const rule = currentRule() || RULES.find(r => r.id === activeRuleId);
  if (!rule) return;
  const normalized = normalizeEligibilityRule(rule);
  if (pendingEligibilityRule && pendingEligibilityRule.id === activeRuleId) {
    pendingEligibilityRule = normalized;
  } else {
    const idx = RULES.findIndex(r => r.id === activeRuleId);
    if (idx >= 0) RULES[idx] = normalized;
  }
  renderDetailPanel(normalized);
}

function applyCoverChoice(sel) {
  const v = sel.value;
  const rule = currentRule();
  if (!rule) return;
  if (!v || v === 'ALL') {
    rule.cover = 'All Covers';
    rule.coverIds = [];
  } else {
    const c = productCovers().find(x => String(x.id) === String(v) || x.code === v || x.name === v);
    rule.cover = c?.name || c?.code || v;
    rule.coverIds = c?.id ? [c.id] : [v];
  }
  persistRules();
  loadRule(activeRuleId);
}

  const opts = [`<option value="ALL" ${!selectedId && (!rule.cover || rule.cover === 'All Covers') ? 'selected' : ''}>All Covers</option>`]

      return `<option value="${htmlEsc(c.id)}" ${sel ? 'selected' : ''}>${htmlEsc(c.name || c.code)}</option>`;

  return `<select class="form-control" id="el-rule-cover" data-el-validate="cover" ${dis} onchange="applyCoverChoice(this)">${opts.join('')}</select>`;

function collectTestFields() {
  const fields = [];
  const seen = new Set();
  const add = (attr, c) => {
    const key = attr?.id || c?.attributeId || c?.field;
    if (!key || seen.has(key)) return;
    seen.add(key);
    fields.push({ key, cond: c || { attributeId: attr.id, field: riskAttributeFieldKey(attr), sourceQuestionId: attr.questionId || attr.sourceQuestionId }, attr: attr || resolveConditionAttr(c) });
  };
  eligibilityRiskAttributes().forEach(a => add(a));
  RULES.forEach(r => {
    normalizeEligibilityRule(r).conditions.forEach(c => add(resolveConditionAttr(c), c));
  });
  return fields;
}

const TEST_FIELD_DEFAULTS = {};

function testFieldInputHtml(item) {
  const key = typeof item === 'string' ? item : item.key;
  const cond = typeof item === 'object' ? item.cond : null;
  const attr = typeof item === 'object' ? item.attr : resolveConditionAttr({ field: key, attributeId: key });
  const found = findQuestionById(cond?.sourceQuestionId || attr?.questionId);
  const label = found?.q?.label || attr?.name || key;
  const type = riskDataType(attr, found?.q);
  const id = 'test-' + String(key).replace(/[^a-z0-9_]/gi, '-');
  const def = TEST_FIELD_DEFAULTS[key] ?? TEST_FIELD_DEFAULTS[slugField(label)] ?? '';
  const opts = questionOptions(attr, found?.q);
  if ((type === 'select' || type === 'multi-select') && opts.length) {
    return `<div class="form-group"><label class="form-label">${htmlEsc(label)}</label>
      <select id="${id}" class="form-control test-field" data-field="${htmlEsc(key)}" data-qid="${htmlEsc(attr?.questionId || '')}" ${type === 'multi-select' ? 'multiple' : ''}>
        ${opts.map(o => `<option value="${htmlEsc(o.value)}">${htmlEsc(o.label)}</option>`).join('')}
      </select></div>`;
  }
  if (type === 'boolean') {
    return `<div class="form-group"><label class="form-label">${htmlEsc(label)}</label>
      <select id="${id}" class="form-control test-field" data-field="${htmlEsc(key)}">
        <option>Yes</option><option>No</option>
      </select></div>`;
  }
  if (type === 'date') {
    return `<div class="form-group"><label class="form-label">${htmlEsc(label)}</label>
      <input type="date" id="${id}" class="form-control test-field" data-field="${htmlEsc(key)}" data-qid="${htmlEsc(attr?.questionId || '')}" value="${htmlEsc(def)}"></div>`;
  }
  if (type === 'number' || type === 'currency') {
    return `<div class="form-group"><label class="form-label">${htmlEsc(label)}</label>
      <input type="number" step="${type === 'currency' ? '0.01' : 'any'}" id="${id}" class="form-control test-field" data-field="${htmlEsc(key)}" data-qid="${htmlEsc(attr?.questionId || '')}" value="${htmlEsc(def)}" placeholder="Enter value"></div>`;
  }
  return `<div class="form-group"><label class="form-label">${htmlEsc(label)}</label>
    <input type="text" id="${id}" class="form-control test-field" data-field="${htmlEsc(key)}" data-qid="${htmlEsc(attr?.questionId || '')}" value="${htmlEsc(def)}" placeholder="Enter value"></div>`;
}

function parseListValue(val) {
  return String(val || '').split(',').map(s => s.trim()).filter(Boolean);
}

function inputValueForCondition(c, inputs) {
  const attr = resolveConditionAttr(c);
  const keys = [c.attributeId, attr?.id, c.field, attr?.questionId, c.sourceQuestionId, riskAttributeFieldKey(attr)].filter(Boolean);
  for (const k of keys) {
    if (inputs[k] !== undefined && inputs[k] !== null && String(inputs[k]).trim() !== '') return inputs[k];
  }
  for (const k of keys) {
    if (Object.prototype.hasOwnProperty.call(inputs, k)) return inputs[k];
  }
  return undefined;
}

function compareCondition(field, op, value, inputs, cond) {
  const c = cond || { field, op, value };
  const raw = inputValueForCondition(c, inputs);
  const nOp = normalizeOp(op);
  if (nOp === 'IS EMPTY') return raw === undefined || raw === null || String(raw).trim() === '';
  if (nOp === 'IS NOT EMPTY') return !(raw === undefined || raw === null || String(raw).trim() === '');
  if (nOp === 'Is True') {
    const t = String(raw).toLowerCase();
    return t === 'yes' || t === 'true' || t === '1';
  }
  if (nOp === 'Is False') {
    const t = String(raw).toLowerCase();
    return t === 'no' || t === 'false' || t === '0';
  }
  if (raw === undefined || raw === null || String(raw).trim() === '') return null;
  const numVal = parseFloat(value);
  const numRaw = parseFloat(raw);
  const dateRaw = Date.parse(raw);
  const dateVal = Date.parse(value);
  switch (nOp) {
    case '<':
    case 'Less Than': return numRaw < numVal;
    case '>':
    case 'Greater Than': return numRaw > numVal;
    case '≤':
    case 'Less Than or Equal': return numRaw <= numVal;
    case '≥':
    case 'Greater Than or Equal': return numRaw >= numVal;
    case '=':
    case 'Equals':
    case 'On':
      return String(raw).toLowerCase() === String(value).toLowerCase();
    case '≠':
    case 'Not Equals':
      return String(raw).toLowerCase() !== String(value).toLowerCase();
    case 'IN': return parseListValue(value).some(v => v.toLowerCase() === String(raw).toLowerCase());
    case 'NOT IN': return !parseListValue(value).some(v => v.toLowerCase() === String(raw).toLowerCase());
    case 'Starts with': return String(raw).toLowerCase().startsWith(String(value).toLowerCase());
    case 'Ends with': return String(raw).toLowerCase().endsWith(String(value).toLowerCase());
    case 'Is':
    case 'Is not': {
      const yes = ['yes', 'true', '1'].includes(String(raw).toLowerCase());
      const wantYes = ['yes', 'true', '1'].includes(String(value).toLowerCase());
      return nOp === 'Is' ? yes === wantYes : yes !== wantYes;
    }
    case 'Contains Any': {
      const needles = parseListValue(value);
      const hay = parseListValue(raw);
      const blob = String(raw).toLowerCase();
      return needles.some(n => hay.some(h => h.toLowerCase() === n.toLowerCase()) || blob.includes(n.toLowerCase()));
    }
    case 'Contains All': {
      const needles = parseListValue(value);
      const hay = parseListValue(raw);
      const blob = String(raw).toLowerCase();
      return needles.every(n => hay.some(h => h.toLowerCase() === n.toLowerCase()) || blob.includes(n.toLowerCase()));
    }
    case 'Contains':
    case 'CONTAINS': {
      const list = parseListValue(raw);
      if (list.length > 1) return list.some(v => v.toLowerCase() === String(value).toLowerCase()) || String(raw).toLowerCase().includes(String(value).toLowerCase());
      return String(raw).toLowerCase().includes(String(value).toLowerCase());
    }
    case 'Does not contain':
    case 'Does Not Contain':
    case 'NOT CONTAINS': return !String(raw).toLowerCase().includes(String(value).toLowerCase());
    case 'Between': {
      const lo = parseFloat(c.value);
      const hi = parseFloat(c.value2);
      return numRaw >= lo && numRaw <= hi;
    }
    case 'Before': return dateRaw < dateVal;
    case 'After': return dateRaw > dateVal;
    case 'Before or On': return dateRaw <= dateVal;
    case 'After or On': return dateRaw >= dateVal;
    default: return false;
  }
}

function evaluateRule(rule, inputs) {
  rule = normalizeEligibilityRule(rule);
  if (rule.status !== 'active') return { triggered: false, na: true, summary: 'Inactive rule — skipped' };
  const conditions = rule.conditions || [];
  if (!conditions.length) return { triggered: false, na: true, summary: 'No conditions configured' };

  const results = conditions.map(c => compareCondition(c.field, c.op, c.value, inputs, c));
  if (results.some(r => r === null)) {
    return { triggered: false, na: true, summary: conditions.map(c => `${compileConditionLine(c)} = ${inputValueForCondition(c, inputs) ?? 'N/A'}`).join(', ') + ' — N/A (not entered)' };
  }

  const logic = String(rule.logic || 'and').toLowerCase();
  const combined = logic === 'or' ? results.some(Boolean) : results.every(Boolean);
  const triggered = rule.direction === 'eligible' ? !combined : combined;
  const condText = conditions.map(compileConditionLine).join(` ${logic.toUpperCase()} `);
  const inputText = conditions.map(c => `${c.attributeId || c.field} = ${inputValueForCondition(c, inputs)}`).join(', ');
  return { triggered, na: false, summary: inputText, condText };
}

function gatherTestInputs() {
  const inputs = {};
  document.querySelectorAll('.test-field').forEach(el => {
    const field = el.getAttribute('data-field');
    if (!field) return;
    inputs[field] = el.value;
    const qid = el.getAttribute('data-qid');
    if (qid) inputs[qid] = el.value;
  });
  return inputs;
}

function runEligibilityTest() {
  const inputs = gatherTestInputs();
  const sorted = [...RULES].map(normalizeEligibilityRule).sort((a, b) => (a.priority || 99) - (b.priority || 99));
  const results = sorted.map(rule => {
    const ev = evaluateRule(rule, inputs);
    return { rule, triggered: ev.triggered, pass: !ev.triggered, na: ev.na, summary: ev.summary, condText: ev.condText };
  });

  const triggered = results.filter(r => r.triggered);
  const hardHits = triggered.filter(r => r.rule.outcomeType === 'hard');
  const referHits = triggered.filter(r => r.rule.outcomeType === 'refer');
  const eligible = hardHits.length === 0;
  const overall = hardHits.length ? 'HARD BLOCK' : (referHits.length ? 'REFER TO UNDERWRITER' : (triggered.length ? 'WARNING' : 'ELIGIBLE'));
  const resultPanel = document.getElementById('test-results');
  if (!resultPanel) return;
  const headline = hardHits.length
    ? `Rule triggered: ${hardHits[0].rule.name}`
    : (referHits.length ? 'Submission is routed for underwriting review.' : (triggered.length ? 'Submission can proceed with warning.' : 'No eligibility rules were triggered.'));
  if (!resultPanel) return;

  resultPanel.innerHTML = `
    <div style="display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-5);padding:var(--space-4);border-radius:var(--radius-md);${!eligible ? 'background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.35)' : 'background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.35)'}">
      <span style="font-size:24px">${hardHits.length ? '❌' : '✅'}</span>
      <div>
        <div style="font-size:16px;font-weight:700;color:${hardHits.length ? 'var(--color-danger)' : 'var(--color-success)'}">RESULT: ${htmlEsc(overall)}</div>
        <div style="font-size:13px;color:var(--color-muted)">${htmlEsc(headline)}</div>
      </div>
    </div>

    ${results.map(r => {
      const cls = r.na ? 'test-na' : (r.pass ? 'test-pass' : 'test-fail');
      const icon = r.na ? '○' : (r.pass ? '✓' : '✕');
      return `
      <div class="test-result-item ${cls}">
        <span class="test-icon">${icon}</span>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:500">${htmlEsc(r.rule.name)} (${htmlEsc(r.rule.id)})</div>
          ${(r.rule.conditions || []).map(c => {
            const attr = resolveConditionAttr(c);
            const actual = inputValueForCondition(c, inputs);
            return `<div style="font-size:11px;color:var(--color-muted);margin-top:4px">
              <div><strong>Risk Attribute:</strong> ${htmlEsc(attrDisplayName(attr || {}) || c.field || '—')}</div>
              <div><strong>Actual Value:</strong> ${htmlEsc(actual == null || actual === '' ? '—' : actual)}</div>
              <div><strong>Condition:</strong> ${htmlEsc(compileConditionLine(c))}</div>
            </div>`;
          }).join('')}
          <div style="font-size:12px;color:var(--color-muted);margin-top:4px">${htmlEsc(r.summary)} — ${r.na ? 'N/A' : (r.pass ? 'PASS' : 'TRIGGERED')}</div>
          ${r.triggered ? `<div style="font-size:12px;margin-top:4px"><strong>Outcome:</strong> ${htmlEsc(outcomeLabel(r.rule.outcomeType))}${r.rule.customerMsg ? ` — "${htmlEsc(r.rule.customerMsg)}"` : ''}</div>` : ''}
        </div>
      </div>`;
    }).join('')}
  `;
}
