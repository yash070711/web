<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rating &amp; Pricing Guide — SouthLake Carrier Portal</title>
  <meta name="description" content="Configure premium calculations — base rates, risk factors, rate tables, loadings, discounts, fees, taxes, and the premium formula.">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/rating-experience.css">
  <link rel="stylesheet" href="assets/studio-hub.css">
  <style>
    .studio-layout { display: grid; grid-template-columns: 280px 1fr; gap: var(--space-5); align-items: start; }

    /* ── Component Tree ────────────────────────── */
    .comp-sidebar { position: sticky; top: calc(56px + var(--space-6)); }
    .comp-group { margin-bottom: var(--space-1); }
    .comp-group-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .6px; color: var(--color-muted);
      padding: var(--space-3) var(--space-4) var(--space-1);
    }
    .comp-item {
      display: flex; align-items: center; gap: var(--space-3);
      padding: 8px var(--space-4) 8px calc(var(--space-4) + 10px);
      border-radius: var(--radius-md); cursor: pointer;
      border-left: 3px solid transparent; transition: background .1s, border-color .1s;
    }
    .comp-item:hover { background: var(--color-surface); }
    .comp-item.active { background: var(--color-brand-light); border-left-color: var(--color-brand); }
    .comp-item-name { font-size: 13px; font-weight: 500; flex: 1; color: var(--color-ink); }
    .comp-item.active .comp-item-name { color: var(--color-brand); }
    .comp-item-value { font-size: 11px; font-family:'IBM Plex Mono',monospace; color: var(--color-muted); }
    .comp-item-status { flex-shrink: 0; font-size: 12px; }
    .comp-formula-btn {
      width: calc(100% - var(--space-4)); margin: var(--space-2) var(--space-2);
      display: flex; align-items: center; justify-content: center; gap: var(--space-2);
      padding: 8px; font-size: 12px; font-weight: 600; color: var(--color-brand);
      background: var(--color-brand-light); border: 1px dashed var(--color-brand);
      border-radius: var(--radius-md); cursor: pointer; transition: all .15s;
    }
    .comp-formula-btn:hover { background: var(--color-brand); color: #fff; }

    /* ── Section card ──────────────────────────── */
    .section-card { background: var(--color-panel); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
    .section-header { display: flex; align-items: center; justify-content: space-between; padding: var(--space-4) var(--space-5); cursor: pointer; user-select: none; transition: background .1s; }
    .section-header:hover { background: var(--color-surface); }
    .section-header-left { display: flex; align-items: center; gap: var(--space-3); }
    .section-number { width: 24px; height: 24px; border-radius: 50%; background: var(--color-brand-light); color: var(--color-brand); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .section-title { font-size: 14px; font-weight: 600; }
    .section-subtitle { font-size: 12px; color: var(--color-muted); margin-top: 1px; }
    .section-chevron { color: var(--color-muted); transition: transform .2s; }
    .section-chevron.open { transform: rotate(90deg); }
    .section-body { border-top: 1px solid var(--color-border); max-height: 0; overflow: hidden; transition: max-height .3s ease; }
    .section-body.open { max-height: 3000px; }
    .section-inner { padding: var(--space-5) var(--space-6); }

    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4) var(--space-6); }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-4); }
    .span-2 { grid-column: 1 / -1; }

    /* ── Type badge ────────────────────────────── */
    .type-badge {
      display: inline-flex; height: 22px; padding: 0 10px; border-radius: 4px;
      font-size: 10px; font-weight: 700; letter-spacing: .3px; align-items: center;
      text-transform: uppercase;
    }
    .type-base     { background: var(--color-brand-light); color: var(--color-brand); }
    .type-factor   { background: #F3E8FF; color: #7C3AED; }
    .type-loading  { background: #FEF3C7; color: var(--color-warning); }
    .type-discount { background: #DCFCE7; color: var(--color-success); }
    .type-fee      { background: #F1F5F9; color: var(--color-muted); }
    .type-tax      { background: #FEE2E2; color: var(--color-danger); }

    /* ── Rate table ────────────────────────────── */
    .rate-table { width: 100%; border-collapse: collapse; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; }
    .rate-table th {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px;
      color: var(--color-muted); padding: var(--space-2) var(--space-3); text-align: left;
      background: var(--color-surface); border-bottom: 1px solid var(--color-border);
    }
    .rate-table td {
      padding: var(--space-2) var(--space-3); font-size: 13px;
      border-bottom: 1px solid var(--color-border);
    }
    .rate-table tr:last-child td { border-bottom: none; }
    .rate-table tr:hover td { background: var(--color-surface); }
    .rate-table .rate-cell {
      font-family: 'IBM Plex Mono', monospace; font-size: 13px;
      text-align: right; font-weight: 500; color: var(--color-ink);
    }
    .rate-table th.rate-cell { text-align: right; }
    .rate-table .rate-band { font-weight: 500; }
    .rate-table .rate-notes { font-size: 12px; color: var(--color-muted); }

    /* 2D rate table */
    .rate-2d { overflow-x: auto; }
    .rate-2d table { min-width: 500px; }
    .rate-2d th.col-header {
      text-align: center; font-size: 12px; font-weight: 600;
      background: var(--color-brand-light); color: var(--color-brand);
    }
    .rate-2d td.row-header {
      font-weight: 600; background: var(--color-surface);
      white-space: nowrap; border-right: 1px solid var(--color-border);
    }
    .rate-2d td.cell {
      text-align: center; font-family: 'IBM Plex Mono',monospace; font-size: 13px;
      font-weight: 500;
    }

    /* ── Formula editor ────────────────────────── */
    .formula-editor {
      background: #0F1117; border-radius: var(--radius-lg);
      overflow: hidden; border: 1px solid #2D3748;
    }
    .formula-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: var(--space-2) var(--space-4);
      background: #1A1F2E; border-bottom: 1px solid #2D3748;
    }
    .formula-toolbar-label { font-size: 11px; font-weight: 600; color: #94A3B8; text-transform: uppercase; letter-spacing: .5px; }
    .formula-code {
      padding: var(--space-5); font-family: 'IBM Plex Mono',monospace;
      font-size: 12px; line-height: 1.8; color: #E2E8F0; overflow-x: auto;
      white-space: pre;
    }
    .f-keyword { color: #7DD3FC; }
    .f-ref     { color: #FCD34D; }
    .f-num     { color: #86EFAC; }
    .f-op      { color: #FB923C; }
    .f-comment { color: #64748B; }
    .f-cond    { color: #F472B6; }
    .formula-status {
      padding: var(--space-3) var(--space-4);
      background: #1A1F2E; border-top: 1px solid #2D3748;
      font-size: 12px; color: #86EFAC; display: flex; align-items: center; gap: var(--space-2);
    }

    /* ── Premium breakdown ─────────────────────── */
    .breakdown { font-family: 'IBM Plex Mono',monospace; font-size: 13px; line-height: 2; }
    .breakdown-group { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: var(--color-muted); margin-top: var(--space-4); }
    .breakdown-row { display: flex; justify-content: space-between; padding: 0 var(--space-2); }
    .breakdown-row:hover { background: var(--color-surface); border-radius: var(--radius-sm); }
    .breakdown-label { color: var(--color-ink); }
    .breakdown-value { font-weight: 600; }
    .breakdown-factor { color: var(--color-brand); }
    .breakdown-sep { border-top: 1px dashed var(--color-border); margin: var(--space-2) 0; }
    .breakdown-total { font-weight: 700; font-size: 15px; }
    .breakdown-note { font-size: 11px; color: var(--color-muted); font-family: inherit; }

    /* Guided-only mode — hide legacy component tree / formula UI */
    body.rating-guided-only #studio-hub,
    body.rating-guided-only #studio-editor,
    body.rating-guided-only .legacy-rating-header { display: none !important; }
    body.rating-guided-only #rating-gui { display: block; }
    .studio-context-bar {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-3) var(--space-5);
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); margin-bottom: var(--space-5); font-size: 13px;
    }
    .studio-context-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px; background: var(--color-panel);
      border: 1px solid var(--color-border); border-radius: 100px;
      font-size: 12px; font-weight: 500;
    }

    /* ── Cap config ────────────────────────────── */
    .cap-row {
      display: flex; align-items: center; gap: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: var(--color-surface); border: 1px solid var(--color-border);
      border-radius: var(--radius-md); margin-bottom: var(--space-2); font-size: 13px;
    }
  </style>

<style id="rating-old-ui-actions">
  .comp-group-head{
    display:flex;align-items:center;justify-content:space-between;
    gap:8px;padding:var(--space-3) var(--space-4) var(--space-1);
  }
  .comp-group-head .comp-group-label{padding:0}
  .comp-group-add{
    border:1px solid var(--color-border);background:var(--color-panel);
    color:var(--color-brand);border-radius:4px;padding:3px 7px;
    font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .comp-group-add:hover{background:var(--color-brand-light)}
  .comp-item-remove{
    flex-shrink:0;border:0;background:transparent;color:var(--color-muted);
    cursor:pointer;border-radius:4px;padding:2px 4px;font-size:12px;
    opacity:.7;
  }
  .comp-item-remove:hover{color:var(--color-danger);background:var(--color-surface);opacity:1}
  .rating-component-actions{
    margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .rating-component-actions .btn{white-space:nowrap}
</style>


<style id="rating-inline-card-edit">
  .rating-choice-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
  .rating-choice-card{border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px;background:var(--color-panel)}
  .rating-choice-top{display:flex;align-items:center;gap:7px}
  .rating-choice-band{font-size:12px;font-weight:600;flex:1}
  .rating-choice-mult{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:var(--color-brand)}
  .rating-choice-note{font-size:10px;color:var(--color-muted);margin-top:5px;min-height:14px}
  .rating-choice-actions{display:flex;gap:5px;margin-top:8px}
  .rating-choice-actions button{font-size:10px;border:1px solid var(--color-border);background:var(--color-panel);border-radius:4px;padding:3px 7px;cursor:pointer}
  .rating-choice-actions button:hover{color:var(--color-brand);border-color:var(--color-brand)}
  .rating-inline-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
  .rating-rule-card{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:11px;margin-bottom:8px;background:var(--color-panel)}
  .rating-rule-card-title{font-size:12px;font-weight:600}
  .rating-rule-card-sub{font-size:10px;color:var(--color-muted);margin-top:3px}
  .rating-rule-card-actions{display:flex;gap:5px}
  .rating-rule-card-actions button{font-size:10px;border:0;background:transparent;color:var(--color-brand);cursor:pointer}
  .rating-rule-card-actions button.remove{color:var(--color-danger)}
  @media(max-width:900px){.rating-choice-grid{grid-template-columns:1fr 1fr}.rating-rule-card{grid-template-columns:1fr}}
  @media(max-width:600px){.rating-choice-grid{grid-template-columns:1fr}}
</style>

<style id="rating-choice-editor-fixed">.rating-edit-row{display:grid;grid-template-columns:1.2fr 1fr 125px 36px;gap:8px;align-items:center;padding:8px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-panel)}.rating-edit-percent-wrap{position:relative}.rating-edit-percent-wrap .form-control{padding-right:25px}.rating-edit-percent-wrap span{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--color-muted)}#rating-edit-choice-rows{display:flex;flex-direction:column;gap:8px}@media(max-width:700px){.rating-edit-row{grid-template-columns:1fr}.rating-edit-remove{justify-self:end}}</style>
<style id="rating-choice-modal-ui-v2">
#rating-edit-choice-rows{display:flex;flex-direction:column;gap:7px}
.rating-edit-heading{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) 105px 72px;gap:8px;padding:0 8px 5px;font-size:10px;font-weight:600;color:var(--color-muted)}
.rating-edit-row{display:grid!important;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) 105px 72px!important;gap:8px;align-items:center;padding:7px 8px!important;border:1px solid var(--color-border);border-radius:6px;background:var(--color-panel)}
.rating-edit-remove{color:#dc2626!important;font-weight:600!important;border:0!important;background:transparent!important;display:flex;align-items:center;justify-content:center;gap:4px;padding:5px!important;cursor:pointer}
.rating-edit-remove:hover{background:#fff1f2!important;color:#b91c1c!important}
.rating-edit-remove .trash{font-size:13px}
.rating-add-choice-row{margin-top:9px;border:1px dashed #f0a500;border-radius:6px;background:#fffaf0;color:var(--color-brand);height:38px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:600;cursor:pointer}
.rating-add-choice-row:hover{background:#fff5dc}
@media(max-width:700px){.rating-edit-heading{display:none}.rating-edit-row{grid-template-columns:1fr!important}.rating-edit-remove{justify-self:end;width:auto}}
</style>
</head>
<body>
<div class="shell" id="app-shell">
  <header class="topbar">
    <a href="index.html" class="topbar-logo" id="topbar-logo"></a>
    <div class="topbar-divider"></div>
    <nav class="topbar-breadcrumb" id="topbar-breadcrumb" aria-label="Breadcrumb"></nav>
    <div class="topbar-right" id="topbar-right"></div>
  </header>
  <nav class="sidenav" id="sidenav" aria-label="Primary navigation"></nav>
  <main class="main-content" id="main-content">
    <div class="page-inner">

      <div class="page-header legacy-rating-header">
        <div class="page-header-left">
          <h1 class="page-title" id="studio-title">Rating & Pricing Guide</h1>
          <p class="page-subtitle" id="studio-subtitle">Loading…</p>
        </div>
        <div class="page-header-actions" id="product-studio-actions">
          <a class="btn btn-ghost" id="customer-view-btn" href="product-view.html">Customer view</a>
          <a class="btn btn-secondary" id="view-product-btn" href="product-detail.html">View Product</a>
        </div>
      </div>

      <div id="studio-library-root" class="hidden"></div>
      <div id="studio-product-workspace">
      <div class="studio-context-bar">
        <span id="ctx-count"></span>
        <div style="margin-left:auto"><a id="ctx-back-link" href="product-detail.html" class="btn btn-ghost btn-sm">← Back to Product</a></div>
      </div>

      <div class="readonly-band" id="readonly-band" style="display:none">
        <span>📌 Published version — rates are read-only. Only Pricing Actuaries may clone to modify.</span>
        <button class="btn btn-primary btn-sm" onclick="PS.actionResult('info','Clone','Clone this version from Product Detail.')">Clone Version to Edit</button>
      </div>

      <div id="studio-hub"></div>
      <div id="rating-gui" aria-label="Guided pricing journey"></div>
      <div id="studio-editor" class="studio-hub-editor hidden">
        <div class="cs-back">
          <button class="btn btn-ghost btn-sm" type="button" onclick="PS.studioHub.back()">← Back to components</button>
        </div>
      <div class="studio-layout">
        <!-- LEFT: Component Tree -->
        <div class="comp-sidebar">
          <div class="card">
            <div class="card-header" style="padding:var(--space-4) var(--space-5)">
              <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--color-muted)">Components</div>
            </div>
            <div style="padding:var(--space-2)" id="comp-tree"></div>
          </div>
        </div>

        <!-- RIGHT: Detail Panel -->
        <div id="detail-panel" style="display:flex;flex-direction:column;gap:var(--space-4)"></div>
      </div>
      </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>
<div class="responsive-warning" role="alert">SouthLake Carrier Portal is optimized for desktop screens.</div>

<script src="assets/data.js"></script>
<script src="assets/product-seeds.js"></script>

/* ═══════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════ */
function ratingItems() {
  if (!COMPONENTS.length) return [];
  if (COMPONENTS[0] && Array.isArray(COMPONENTS[0].items)) {
    return COMPONENTS.flatMap(g => (g.items || []).map(i => Object.assign({}, i, { groupLabel: g.group })));
  }
  return COMPONENTS.map(i => Object.assign({}, i, { groupLabel: i.group || i.type || 'Other' }));
}

function applyRatingItems(list) {
  if (!Array.isArray(list) || !list.length) {
    COMPONENTS.splice(0, COMPONENTS.length);
    activeCompId = '';
    return;
  }
  if (list[0] && Array.isArray(list[0].items)) {
    COMPONENTS.splice(0, COMPONENTS.length, ...list);
  } else {
    const typeGroup = { base: 'BASE PREMIUM', factor: 'RISK FACTORS', loading: 'LOADINGS', discount: 'DISCOUNTS', fee: 'FEES', tax: 'TAXES' };
    const map = {};
    list.forEach(i => {
      const g = i.group || i.groupLabel || typeGroup[i.type] || 'OTHER';
      if (!map[g]) map[g] = { group: g, items: [] };
      map[g].items.push(Object.assign({}, i, {
        status: i.status || 'done',
        value: i.value || (i.amount != null ? String(i.amount) : i.expression || '—')
      }));
    });
    COMPONENTS.splice(0, COMPONENTS.length, ...Object.values(map));
  }
  const flat = ratingItems();
  if (flat.length && !flat.some(c => c.id === activeCompId)) activeCompId = flat[0].id;
  if (!flat.length) activeCompId = '';
}

function removeRatingItem(id) {
  if (COMPONENTS[0] && Array.isArray(COMPONENTS[0].items)) {
    COMPONENTS.forEach(g => { g.items = (g.items || []).filter(i => i.id !== id); });
  } else {
    const idx = COMPONENTS.findIndex(i => i.id === id);
    if (idx >= 0) COMPONENTS.splice(idx, 1);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.body.classList.add('rating-guided-only');
  /* Legacy component hub kept in script for prototype-app persistence only — not shown in guided UI */
  try {

    const bundle = ctx?.productId && PS.prototypeApp?.getProductBundle ? PS.prototypeApp.getProductBundle(ctx.productId, ctx.version) : null;
    const stored = bundle?.ratingComponents || bundle?.rating || null;
    if (Array.isArray(stored) && stored.length) applyRatingItems(stored);

});

function renderTree() {
  const tree = document.getElementById('comp-tree');
  if (!tree) return;
  const groups = COMPONENTS[0] && Array.isArray(COMPONENTS[0].items) ? COMPONENTS : [{ group: 'COMPONENTS', items: COMPONENTS }];

  const groupType = {
    'BASE PREMIUM':'Base Rate',
    'RISK FACTORS':'Risk Factor',
    'LOADINGS':'Loading',
    'DISCOUNTS':'Discount',
    'FEES & TAXES':'Fee',
    'FEES':'Fee',
    'TAXES':'Tax'
  };

  tree.innerHTML = groups.map(g => `
    <div class="comp-group">
      <div class="comp-group-head">
        <div class="comp-group-label">${g.group}</div>

      </div>`).join('')}
    </div>
  `).join('') + `
    <div class="comp-formula-btn" onclick="openFormulaModal()">ƒ Premium Formula</div>
  `;
}

function ratingComponentTypeFromCalc(calc, fallback) {
  const s = String(calc || '').toLowerCase();
  if (s.includes('matrix') || s.includes('factor')) return 'factor';
  if (s.includes('percentage') || s.includes('loading')) return fallback === 'loading' ? 'loading' : 'discount';
  if (s.includes('tax')) return 'tax';
  if (s.includes('fee')) return 'fee';
  if (s.includes('fixed amount')) return 'base';
  return fallback || 'base';
}

function nextRatingComponentId(type) {
  const prefixes = { base:'BR', factor:'FAC', loading:'LDG', discount:'DSC', fee:'FEE', tax:'TAX' };
  const prefix = prefixes[type] || 'CMP';
  const ids = ratingItems().map(c => String(c.id || ''));
  let n = 1;
  let id = `RAT-${prefix}-${String(n).padStart(3, '0')}`;
  while (ids.includes(id)) { n += 1; id = `RAT-${prefix}-${String(n).padStart(3, '0')}`; }
  return id;
}

function persistRatingComponents() {
  try { PS.prototypeApp?.persistCollection?.('ratingComponents', ratingItems()); } catch (_) {}
  try { PS.centralPricing?.saveRatingComponents?.(ratingItems()); } catch (_) {}
}

function addRatingComponentToState(comp) {
  if (COMPONENTS[0] && Array.isArray(COMPONENTS[0].items)) {
    let group = COMPONENTS.find(g => g.group === comp.groupLabel);
    if (!group) { group = { group: comp.groupLabel, items: [] }; COMPONENTS.push(group); }
    delete comp.groupLabel;
    group.items.push(comp);
  } else {
    COMPONENTS.push(comp);
  }
  activeCompId = comp.id;
  persistRatingComponents();
  renderTree();
}

function removeRatingComponent(id) {
  removeRatingItem(id);
  persistRatingComponents();
  const flat = ratingItems();
  activeCompId = flat.length ? flat[0].id : '';
  renderTree();
  if (flat.length) renderDetail(flat[0]);
  else document.getElementById('detail-panel')?.replaceChildren();
}

  if (!comp) return;
  renderDetail(comp);
}

function ratingChoiceEscape(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function addRatingChoice(componentId){const c=ratingItems().find(x=>x.id===componentId);if(!c||c.type!=='factor')return;PS.openModal(`<div class="modal-header"><div><h2 class="modal-title">Edit ${ratingChoiceEscape(c.name)} choices</h2><div style="font-size:12px;color:var(--color-muted);margin-top:3px">Choose the outcome for each customer group. No calculations are required.</div></div><button class="btn btn-icon" onclick="PS.closeModal()">×</button></div><div class="modal-body"><div class="rating-edit-heading"><div>Customer group</div><div>Outcome</div><div>Percentage</div><div>Actions</div></div><div id="rating-edit-choice-rows">${ratingChoiceRowsHtml(c.table1D||[])}</div><button type="button" class="rating-add-choice-row" onclick="addRatingChoiceRow()"><span style="font-size:16px">⊕</span> Add another ${ratingChoiceEscape(c.name.toLowerCase())} choice</button><div style="background:var(--color-info-light);padding:10px 12px;border-radius:6px;font-size:11px;margin-top:10px;border-left:3px solid var(--color-brand)">Example: choosing <b>Increase price</b> and <b>25%</b> means a customer in that group pays 25% more than the starting price.</div></div><div class="modal-footer"><button class="btn btn-secondary" onclick="PS.closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveRatingChoices('${componentId}')">Save choices</button></div>`,'modal-lg');bindRatingChoiceRemoveButtons();}
function bindRatingChoiceRemoveButtons(){document.querySelectorAll('#rating-edit-choice-rows .rating-edit-remove').forEach(btn=>btn.onclick=function(){this.closest('[data-choice-row]')?.remove();});}
function addRatingChoiceRow(){const wrap=document.getElementById('rating-edit-choice-rows');if(!wrap)return;const d=document.createElement('div');d.innerHTML=ratingChoiceRowsHtml([{band:'',mult:'1',note:''}]);wrap.appendChild(d.firstElementChild);bindRatingChoiceRemoveButtons();}
function editRatingChoice(componentId,index){addRatingChoice(componentId);}
function saveRatingChoices(componentId){const c=ratingItems().find(x=>x.id===componentId);if(!c)return;const rows=[];document.querySelectorAll('#rating-edit-choice-rows [data-choice-row]').forEach(row=>{const band=row.querySelector('.rating-edit-band')?.value.trim()||'';const outcome=row.querySelector('.rating-edit-outcome')?.value||'same';const pct=Number(row.querySelector('.rating-edit-percent')?.value||0);if(!band||!Number.isFinite(pct)||pct<0)return;let mult=1;if(outcome==='increase')mult=1+pct/100;if(outcome==='decrease')mult=Math.max(0,1-pct/100);rows.push({band,mult:String(Number(mult.toFixed(4))),note:''});});if(!rows.length){PS.actionResult('error','Required choice','Add at least one customer group choice.');return;}c.table1D=rows;c.value='table';persistRatingComponents();renderTree();renderDetail(c);PS.closeModal();PS.actionResult('success','Choices Updated',`${c.name} choices were updated.`);}
function removeRatingChoice(componentId,index){const c=ratingItems().find(x=>x.id===componentId);if(!c||!c.table1D?.[index])return;const name=c.table1D[index].band;if(!confirm(`Remove "${name}" from ${c.name}?`))return;c.table1D.splice(index,1);persistRatingComponents();renderTree();renderDetail(c);PS.actionResult('success','Choice Removed',`"${name}" was removed.`);}

function openEditComponentModal(componentId){
  const c=ratingItems().find(x=>x.id===componentId); if(!c)return;
  const current=c.type==='base'?Number(c.amount||0):c.type==='factor'?1:c.type==='loading'?Number(c.loadingValue||0):c.type==='discount'?Number(c.discountValue||0):c.type==='fee'?Number(c.feeAmount||0):Number(c.taxRate||0);
  PS.openModal(`
    <div class="modal-header"><h2 class="modal-title">Edit ${c.name}</h2><button class="btn btn-icon" onclick="PS.closeModal()">×</button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">Name <span class="required">*</span></label><input id="ec-name" class="form-control" value="${String(c.name||'').replace(/"/g,'&quot;')}"></div>
      <div class="form-group"><label class="form-label">${c.type==='base'?'Base Price':c.type==='factor'?'Default Multiplier':'Value'}</label><input id="ec-value" type="number" step="0.01" class="form-control" value="${current}"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" onclick="PS.closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditedComponent('${componentId}')">Save</button></div>
  `,'modal-md');
}
function saveEditedComponent(componentId){
  const c=ratingItems().find(x=>x.id===componentId); if(!c)return;
  const name=document.getElementById('ec-name')?.value.trim();
  const val=document.getElementById('ec-value')?.value;
  if(!name || val===''){PS.actionResult('error','Required fields','Name and value are required.');return;}
  c.name=name;
  const n=Number(val);
  if(c.type==='base'){c.amount=n.toFixed(2);c.value=`$${c.amount}/yr`;}
  else if(c.type==='factor'){if(!Array.isArray(c.table1D))c.table1D=[]; if(c.table1D.length)c.table1D[0].mult=String(n);else c.table1D.push({band:'Default',mult:String(n),note:''});c.value='table';}
  else if(c.type==='loading'){c.loadingValue=String(n);c.value=`+${n}%`;}
  else if(c.type==='discount'){c.discountValue=String(n);c.value=`${n}%`;}
  else if(c.type==='fee'){c.feeAmount=String(n);c.value=`$${n}`;}
  else if(c.type==='tax'){c.taxRate=String(n);c.value=`${n}%`;}
  persistRatingComponents();renderTree();renderDetail(c);PS.closeModal();
  PS.actionResult('success','Updated',`"${name}" was updated.`);
}

function configuredLivePremium(){
  const items=ratingItems();
  const base=items.find(x=>x.type==='base');
  let p=Number(base?.amount||350);
  items.filter(x=>x.type==='factor').forEach(x=>{
    const rows=Array.isArray(x.table1D)?x.table1D:[];
    const m=Number(rows[0]?.mult||1);
    p*=m;
  });
  items.filter(x=>x.type==='loading').forEach(x=>{
    const v=Number(x.loadingValue||0);
    p += String(x.loadingType||'').toLowerCase().includes('percentage') ? p*v/100 : v;
  });
  items.filter(x=>x.type==='discount').forEach(x=>{
    const v=Number(x.discountValue||0);
    p -= p*v/100;
  });
  items.filter(x=>x.type==='fee').forEach(x=>p+=Number(x.feeAmount||0));
  items.filter(x=>x.type==='tax').forEach(x=>{
    const v=Number(x.taxRate||0);
    p += p*v/100;
  });
  return {base:Number(base?.amount||0),premium:p};
}

function runPremiumCalc() {
  const age = parseInt(document.getElementById('pt-age')?.value || 35, 10);
  const vAge = parseInt(document.getElementById('pt-vage')?.value || 5, 10);
  const ncd = parseInt(document.getElementById('pt-ncd')?.value || 3, 10);
  const si = parseFloat(document.getElementById('pt-si')?.value || 28000);
  const conv = document.getElementById('pt-conv')?.value === 'Yes';
  const zone = document.getElementById('pt-zone')?.value || 'Zone B (Urban)';
  const vehicleUse = document.getElementById('pt-use')?.value || 'Private';

  const ageFactor = age <= 25 ? 1.45 : age <= 30 ? 1.25 : age <= 40 ? 1.00 : age <= 50 ? 0.95 : age <= 60 ? 1.05 : age <= 70 ? 1.15 : 1.40;
  const vAgeFactor = vAge <= 3 ? 1.10 : vAge <= 7 ? 0.95 : vAge <= 12 ? 1.05 : 1.20;
  const territoryUseTable = {
    'Zone A (Metro)': {'Private':1.20,'Commercial Light':1.40,'Hire':1.80},
    'Zone B (Urban)': {'Private':1.10,'Commercial Light':1.30,'Hire':1.65},
    'Zone C (Suburban)': {'Private':1.00,'Commercial Light':1.20,'Hire':1.50},
    'Zone D (Rural)': {'Private':0.90,'Commercial Light':1.10,'Hire':1.40},
    'Zone E (Remote)': {'Private':1.05,'Commercial Light':1.25,'Hire':1.55}
  };
  const useFactorMap = { 'Private':1.00, 'Commercial Light':1.25, 'Hire':1.60 };
  const terrFactor = territoryUseTable[zone]?.[vehicleUse] ?? 1.10;
  const useFactor = useFactorMap[vehicleUse] ?? 1.00;
  const claimsFactor = ncd >= 5 ? 0.70 : ncd >= 3 ? 0.70 : ncd >= 1 ? 0.90 : 1.00;

  const baseRate = 350;
  const odPremium = baseRate * ageFactor * vAgeFactor * terrFactor * useFactor * claimsFactor;
  const convLoad = conv ? odPremium * 0.15 : 0;
  const hvLoad = si > 40000 ? 50 : 0;
  const ncdPct = ncd >= 5 ? 50 : Math.max(0, Math.min(ncd, 5)) * 10;
  const ncdDiscount = odPremium * (ncdPct / 100);

  const odNet = odPremium + convLoad + hvLoad - ncdDiscount;
  const tpPremium = odNet * 0.30;
  const paPremium = 45;
  const theftPrem = odNet * 0.15;
  const netPremium = odNet + tpPremium + paPremium + theftPrem;
  const adminFee = 25;
  const stampDuty = 5;
  const gross = netPremium + adminFee + stampDuty;
  const gst = gross * 0.18;
  const payable = gross + gst;
  const f = n => Number(n).toFixed(2);

  document.getElementById('premium-result').innerHTML = `
    <div style="background:var(--color-brand-light);border-radius:var(--radius-md);padding:var(--space-4) var(--space-5);margin-bottom:var(--space-5);text-align:center">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--color-brand);font-weight:600;margin-bottom:4px">Payable Premium</div>
      <div style="font-size:32px;font-weight:800;color:var(--color-brand);font-family:'IBM Plex Mono',monospace">$${f(payable)}</div>
      <div style="font-size:12px;color:var(--color-muted);margin-top:4px">Annual · Monthly: $${f(payable/12)} ×12</div>
    </div>
    <div class="breakdown">
      <div class="breakdown-group">Base Premium</div>
      <div class="breakdown-row"><span class="breakdown-label">Base Rate</span><span class="breakdown-value">$${f(baseRate)}</span></div>

      <div class="breakdown-group">Risk Factors Applied</div>
      <div class="breakdown-row"><span class="breakdown-label">Driver Age (${age} → band)</span><span class="breakdown-factor">× ${ageFactor.toFixed(2)}</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Vehicle Age (${vAge} yrs)</span><span class="breakdown-factor">× ${vAgeFactor.toFixed(2)}</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Territory (${zone})</span><span class="breakdown-factor">× ${terrFactor.toFixed(2)}</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Vehicle Use (${vehicleUse})</span><span class="breakdown-factor">× ${useFactor.toFixed(2)}</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Claims History</span><span class="breakdown-factor">× ${claimsFactor.toFixed(2)}</span></div>

      <div class="breakdown-group">Cover Premiums</div>
      <div class="breakdown-row"><span class="breakdown-label">Own Damage</span><span class="breakdown-value">$${f(odNet)}</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Third Party (30%)</span><span class="breakdown-value">$${f(tpPremium)}</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Personal Accident (Flat)</span><span class="breakdown-value">$${f(paPremium)}</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Theft (15%)</span><span class="breakdown-value">$${f(theftPrem)}</span></div>
      <div class="breakdown-sep"></div>
      <div class="breakdown-row"><span class="breakdown-label"><strong>Net Premium</strong></span><span class="breakdown-value">$${f(netPremium)}</span></div>

      <div class="breakdown-group">Discounts</div>
      <div class="breakdown-row"><span class="breakdown-label">No Claims Discount (${ncdPct}%)</span><span class="breakdown-value" style="color:var(--color-success)">-$${f(ncdDiscount)}</span></div>
      ${convLoad>0?`<div class="breakdown-group">Loadings</div><div class="breakdown-row"><span class="breakdown-label">Conviction Loading</span><span class="breakdown-value" style="color:var(--color-warning)">+$${f(convLoad)}</span></div>`:''}
      ${hvLoad>0?`<div class="breakdown-row"><span class="breakdown-label">High-Value Vehicle</span><span class="breakdown-value" style="color:var(--color-warning)">+$${f(hvLoad)}</span></div>`:''}

      <div class="breakdown-group">Fees</div>
      <div class="breakdown-row"><span class="breakdown-label">Policy Admin Fee</span><span class="breakdown-value">$${f(adminFee)}</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Stamp Duty</span><span class="breakdown-value">$${f(stampDuty)}</span></div>

      <div class="breakdown-group">Taxes</div>
      <div class="breakdown-row"><span class="breakdown-label">GST at 18%</span><span class="breakdown-value" style="color:var(--color-danger)">$${f(gst)}</span></div>
      <div class="breakdown-sep"></div>
      <div class="breakdown-row breakdown-total"><span class="breakdown-label">PAYABLE PREMIUM</span><span class="breakdown-value" style="color:var(--color-brand)">$${f(payable)}</span></div>
    </div>`;
}

function executeAddComponent(type, kind, generatedId) {
  const nameEl = document.getElementById('new-comp-name');
  const name = nameEl?.value.trim();
  if (!name) {
    nameEl?.focus();
    PS.actionResult('error','Cannot add component','Component Name is required.');
    return;
  }
  const id = String(generatedId || document.getElementById('new-comp-id')?.value || '').trim();
  const calc = document.getElementById('new-comp-calc')?.value || '';
  const cover = document.getElementById('new-comp-cover')?.value || '';
  const rawValue = document.getElementById('new-comp-val')?.value || '';
  const description = document.getElementById('new-comp-desc')?.value.trim() || '';
  const num = Number(rawValue);
  const value = kind === 'base' ? `$${rawValue}/yr` : kind === 'factor' ? String(rawValue || '1.00') : kind === 'discount' || kind === 'loading' ? `+${rawValue}%` : `$${rawValue}`;
  const groupMap = { base:'BASE PREMIUM', factor:'RISK FACTORS', loading:'LOADINGS', discount:'DISCOUNTS', fee:'FEES & TAXES', tax:'FEES & TAXES' };
  const comp = {
    id, name, value, status:'draft', type:kind, groupLabel:groupMap[kind] || 'OTHER',
    cover: cover || 'All Covers (Policy Level)',
    notes: description,
    basis: kind === 'base' ? calc : undefined,
    amount: kind === 'base' && Number.isFinite(num) ? num.toFixed(2) : undefined,
    currency: kind === 'base' ? 'USD' : undefined,
    factorType: kind === 'factor' ? calc : undefined,
    lookupAttr: kind === 'factor' ? '' : undefined,
    dims: kind === 'factor' ? '1D' : undefined,
    table1D: kind === 'factor' ? [{ band:'Default', mult:String(rawValue || '1.00'), note:description }] : undefined,
    loadingType: kind === 'loading' ? 'Percentage' : undefined,
    loadingValue: kind === 'loading' ? String(rawValue || '0') : undefined,
    discountType: kind === 'discount' ? 'Percentage' : undefined,
    discountValue: kind === 'discount' ? String(rawValue || '0') : undefined,
    feeType: kind === 'fee' ? calc : undefined,
    feeAmount: kind === 'fee' ? String(rawValue || '0') : undefined,
    taxType: kind === 'tax' ? calc : undefined,
    taxRate: kind === 'tax' ? String(rawValue || '0') : undefined
  };
  Object.keys(comp).forEach(k => comp[k] === undefined ? delete comp[k] : null);
  addRatingComponentToState(comp);
  renderTree();
  const added = ratingItems().find(x => x.id === id);
  if (added) renderDetail(added);
  PS.closeModal();
  PS.actionResult('success','Component Added',`Added "${name}" (${id}) to Rating Guide draft.`);
}
