function coverLibraryMatch(lib, cover) {
  const ln = String(lib.name || '').toLowerCase();
  const cn = String(cover.name || '').toLowerCase();
  if (!ln || !cn) return false;
  if (cn === ln || cn.includes(ln) || ln.includes(cn.split(/[—-]/)[0].trim())) return true;
  const lc = String(lib.code || '').toLowerCase().replace(/-\d+$/, '');
  const cc = String(cover.code || '').toLowerCase();
  return Boolean(lc && cc && cc.startsWith(lc));
}

function collectProductCoverUsage() {
  const app = PS.prototypeApp;
  const products = app?.state?.products || PS.data?.products || [];
  const details = app?.state?.productDetails || {};
  const collections = app?.state?.collections || {};
  const byProduct = new Map();
  const add = (productId, cover) => {
    if (!productId || !cover) return;
    if (!byProduct.has(productId)) byProduct.set(productId, []);
    byProduct.get(productId).push(cover);
  };
  Object.keys(collections).forEach(key => {
    if (!key.endsWith('::covers') && !key.endsWith('::coverPool')) return;
    const productId = key.split('::')[0];
    (collections[key] || []).forEach(c => add(productId, c));
  });
  Object.entries(PS.studioSeeds || {}).forEach(([productId, seed]) => {
    (seed.covers || []).forEach(c => add(productId, c));
  });
  products.forEach(p => {
    const bundle = app?.getProductBundle?.(p.id, p.version);
    (bundle?.covers || []).forEach(c => add(p.id, c));
  });
  const catalog = (window.PREDEFINED_COVER_LIBRARY || TRUCKING_DEFAULT_COVER_CATALOG).concat(app?.libraryExtrasFor?.('coverage') || []);
  return catalog.map(lib => {
    const used = [];
    const seen = new Set();
    byProduct.forEach((covers, productId) => {
      if (!covers.some(c => coverLibraryMatch(lib, c))) return;
      if (seen.has(productId)) return;
      seen.add(productId);
      const product = products.find(p => p.id === productId) || details[productId];
      const match = covers.find(c => coverLibraryMatch(lib, c));
      used.push({
        id: productId,
        name: product?.name || productId,
        coverId: match?.id || '',
        version: product?.version || ''
      });
    });
    used.sort((a, b) => a.name.localeCompare(b.name));
    return Object.assign({}, lib, { products: used, productCount: used.length });
  });
}

  }
  const ctx = PS.prototypeApp?.context?.() || {};
  productId      = params.get('product') || params.get('id') || ctx.productId || 'PRD-015';
  productVersion = params.get('version') || ctx.version || '2026.08';
  const product  = PS.prototypeApp?.productById?.(productId);
  productName    = product?.name || params.get('name') || productId;
  productStatus  = product?.status || 'draft';
  if (PS.prototypeApp?.rememberContext) PS.prototypeApp.rememberContext({ productId, version: productVersion });

  PS.nav.render('coverage', [
    { label: 'Product Catalogue', href: 'catalogue.html' },
    { label: productName, href: `product-detail.html?id=${productId}` },
    { label: `v${productVersion}`, href: `product-detail.html?id=${productId}&version=${productVersion}` },
    { label: 'Class of Business Guide', href: '#' }
  ]);

  document.getElementById('studio-title').textContent = 'Class of Business Guide';
  document.getElementById('ctx-back-link').href = `product-detail.html?id=${productId}`;
  const customerBtn = document.getElementById('customer-view-btn');
  if (customerBtn) customerBtn.href = PS.customerViewHref ? PS.customerViewHref(productId, productVersion) : `product-view.html?id=${productId}&version=${productVersion}`;
  const productBtn = document.getElementById('view-product-btn');

  const readonlyBand = document.getElementById('readonly-band');
  if (readonlyBand) readonlyBand.style.display = 'none';

  const bundle = PS.prototypeApp?.getProductBundle?.(productId, productVersion);
  if (bundle?.covers?.length) applyProductCovers(bundle.covers);
  else if (COVERS.length && !activeCoverId) activeCoverId = COVERS[0].id;
  productLastModified = product?.lastModified || bundle?.product?.lastModified || '';

function sortedCoversForSidebar() {
  const order = TRUCKING_DEFAULT_COVER_CATALOG.map(c => String(c.name).toLowerCase());
  return [...COVERS].sort((a, b) => {
    const ai = order.indexOf(String(a.name || '').toLowerCase());
    const bi = order.indexOf(String(b.name || '').toLowerCase());
    if (ai === -1 && bi === -1) return 0;
    if (ai === -1) return 1;
    if (bi === -1) return -1;
    return ai - bi;
  });
}

function isTruckingCoverageProduct() {
  const product = PS.prototypeApp?.productById?.(productId);
  return PS.isTruckingProduct?.(product) || String(product?.family || product?.productType || '') === 'Commercial Auto';

function maybeAutoApplyDefaultCovers() {
  if (COVERS.length || !productNeedsCoverSelection() || !isTruckingCoverageProduct()) return false;

const expandedChildCoverageIds = new Set();

function selectedChildCoverages(c) {
  const allowed = TRUCKING_INSURED_ITEM_TYPES_BY_COVERAGE[String(c?.name || '').trim()] || [];
  if (!allowed.length) return [];

  const items = Array.isArray(c?.insuredItems) ? c.insuredItems.slice(1) : [];
  const selected = [];

  items.forEach(item => {
    const value = String(item?.type || item?.name || '').trim();
    if (value && allowed.includes(value) && !selected.includes(value)) {
      selected.push(value);
    }
  });

  return selected;
}

function toggleChildCoverageExpansion(event, coverId) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const id = String(coverId || '');
  if (!id) return;

  if (expandedChildCoverageIds.has(id)) {
    expandedChildCoverageIds.delete(id);
  } else {
    expandedChildCoverageIds.add(id);
  }

  renderCoverList();
}

function removeSelectedChildCoverage(event, coverId, childName) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }

  const c = COVERS.find(x => String(x.id) === String(coverId));
  if (!c || !childName || !coversCanEdit()) return;

  const target = String(childName).trim();
  if (Array.isArray(c.insuredItems)) {
    c.insuredItems = c.insuredItems.filter(item => {
      const value = String(item?.type || item?.name || '').trim();
      return value !== target;
    });
  }

  // Keep any child-selection representation in sync if present.
  if (Array.isArray(c.childCoverages)) {
    c.childCoverages = c.childCoverages.filter(
      child => String(child?.name || child?.type || child || '').trim() !== target
    );
  }

  try { PS.prototypeApp?.persistCollection?.('covers', COVERS); } catch (_) {}

  renderCoverList();
  if (String(activeCoverId) === String(coverId)) {
    paintStudio();
  }
}

function coverPickerActive() {
  return !COVERS.length || (studioMode === 'hub' && productNeedsCoverSelection());
}

function renderCoverList() {
  const list = document.getElementById('cover-list');
  if (!list) return;
  refreshCoverMeta();
  renderCoverAboutCard();
  if (coverPickerActive()) {
    if (productNeedsCoverSelection()) {

      list.innerHTML = catalog.map(c => {

        </div>`;

  const dupCounts = coverNameCounts();

    const nameKey = String(c.name || '').trim().toLowerCase();
    const isDup = dupCounts[nameKey] > 1;

    const showWarn = isDup || !c.complete;
    const childCoverages = selectedChildCoverages(c);
    const childExpanded = expandedChildCoverageIds.has(String(c.id));
    const childSummary = childCoverages.length
      ? `<button type="button"
           class="cover-child-count"
           onclick="toggleChildCoverageExpansion(event, '${htmlEsc(c.id)}')"
           aria-expanded="${childExpanded ? 'true' : 'false'}"
           title="${childExpanded ? 'Hide child coverages' : 'Show child coverages'}">
           ${childCoverages.length} child${childCoverages.length === 1 ? '' : 'ren'}
           <span class="cover-child-chevron">${childExpanded ? '⌃' : '⌄'}</span>
         </button>`
      : '';

    const childList = childExpanded && childCoverages.length
      ? `<div class="cover-child-list" onclick="event.stopPropagation()">
           ${childCoverages.map(child => `
             <div class="cover-child-row">
               <span class="cover-child-dot"></span>
               <span class="cover-child-name">${htmlEsc(child)}</span>
               <button type="button"
                 class="cover-child-remove"
                 onclick="removeSelectedChildCoverage(event, '${htmlEsc(c.id)}', '${htmlEsc(child)}')"
                 aria-label="Remove ${htmlEsc(child)}"
                 title="Remove child coverage">×</button>
             </div>
           `).join('')}
         </div>`
      : '';

    return `
    <div class="cover-item-wrap">
      <div class="cover-item ${c.id === activeCoverId ? 'active' : ''}" onclick="switchCover('${htmlEsc(c.id)}')" id="cover-item-${htmlEsc(c.id)}">

        </div>
      </div>
      ${childList}
    </div>`;
  }).join('');
}

const COVER_ICON_COLORS = [
  { bg:'rgba(139,92,246,.18)', fg:'#A78BFA' },
  { bg:'rgba(34,197,94,.16)', fg:'#4ADE80' },
  { bg:'rgba(249,115,22,.18)', fg:'#FB923C' },
  { bg:'rgba(56,189,248,.16)', fg:'#38BDF8' },
  { bg:'rgba(20,184,166,.16)', fg:'#2DD4BF' },
  { bg:'rgba(192,149,83,.18)', fg:'var(--color-brand)' }
];

function coverIconStyle(cover, index) {
  const palette = COVER_ICON_COLORS[index % COVER_ICON_COLORS.length];
  return `background:${palette.bg};color:${palette.fg}`;
}

function coverInitials(name) {
  return String(name || 'C').split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
}

function coverTypeLabel(c) {
  if (c.availability === 'addon') return 'Add-on';
  const t = coverTypeForName(c.name) || String(c.type || '');
  if (/third party/i.test(t)) return 'Third Party';
  if (/assistance|service/i.test(t)) return 'Service';
  if (/cargo|goods/i.test(t)) return 'Cargo';
  if (/personal accident/i.test(t)) return 'Benefit';
  if (/first party/i.test(t)) return 'First Party';
  return t.split(/\s*(?:—|–|-)\s*/)[0].trim() || 'Cover';
}

function coverIsMandatory(c) {
  return c.availability === 'mandatory';
}

function coverUpdatedLabel(c) {
  return c.lastUpdated || c.updatedAt || productLastModified || '27 May 2025';
}

function coverUpdatedBy(c) {
  return c.lastUpdatedBy || c.updatedBy || productLastModifiedBy || 'Anika Sharma';
}

function filteredCovers() {
  const q = (document.getElementById('cover-search')?.value || '').trim().toLowerCase();
  const filter = document.getElementById('cover-filter')?.value || 'all';
  return COVERS.filter(c => {
    if (filter === 'mandatory' && c.availability !== 'mandatory') return false;
    if (filter === 'optional' && c.availability === 'mandatory') return false;
    if (filter === 'addon' && c.availability !== 'addon') return false;
    if (!q) return true;
    const productHit = `${productName || ''} ${productId || ''}`.toLowerCase().includes(q);
    if (productHit) return true;
    return [c.name, c.code, c.type, c.availability].some(v => String(v || '').toLowerCase().includes(q));
  });
}

function setCoverView(mode) {
  coverView = mode === 'grid' ? 'grid' : 'list';
  document.getElementById('view-list-btn')?.classList.toggle('active', coverView === 'list');
  document.getElementById('view-grid-btn')?.classList.toggle('active', coverView === 'grid');
  renderCoverTable();
}

function coverNameInUse(name, excludeId) {
  const key = String(name || '').trim().toLowerCase();
  if (!key) return false;
  return COVERS.some(c => c.id !== excludeId && String(c.name || '').trim().toLowerCase() === key);
}

function coverNameCounts() {
  const counts = {};
  COVERS.forEach(c => {
    const key = String(c.name || '').trim().toLowerCase();
    if (key) counts[key] = (counts[key] || 0) + 1;
  });
  return counts;
}

function confirmRemoveCover(id) {
  const c = COVERS.find(x => x.id === id);
  if (!c || !coversCanEdit()) return;
  removeCoverFromProduct(id);
}

function removeCoverFromProduct(id) {
  const idx = COVERS.findIndex(c => c.id === id);
  if (idx < 0) return;
  const name = COVERS[idx].name;
  COVERS.splice(idx, 1);
  PS.prototypeApp?.persistCollection?.('covers', COVERS);
  if (activeCoverId === id) activeCoverId = COVERS[0]?.id || '';
  refreshCoverMeta();
  renderCoverTable();
  renderCoverList();
  if (activeCoverId) loadCover(activeCoverId);
  else renderEmptyDetail();
  PS.actionResult?.('success', 'Cover removed', `"${name}" was removed from this product.`);
}

function toggleCoverRowSelect(id, checked) {
  if (checked) selectedCoverIds.add(id);
  else selectedCoverIds.delete(id);
  renderCoverTable();
}

function toggleSelectAllCovers(checked) {
  const rows = filteredCovers().slice((coverPage - 1) * coverPageSize, coverPage * coverPageSize);
  rows.forEach(c => {
    if (checked) selectedCoverIds.add(c.id);
    else selectedCoverIds.delete(c.id);
  });
  renderCoverTable();
}

function renderCoverTable() {
  refreshCoverMeta();
  const wrap = document.getElementById('covers-table-wrap');
  const footer = document.getElementById('covers-table-footer');
  if (!wrap) return;
  const rows = filteredCovers();
  const total = rows.length;
  const pages = Math.max(1, Math.ceil(total / coverPageSize));
  if (coverPage > pages) coverPage = pages;
  const start = total ? (coverPage - 1) * coverPageSize + 1 : 0;
  const end = Math.min(coverPage * coverPageSize, total);
  const pageRows = rows.slice((coverPage - 1) * coverPageSize, coverPage * coverPageSize);

  if (coverPickerActive()) {
    wrap.innerHTML = renderExistingCoverPicker();
    wrap.querySelectorAll('[data-tree-parent]').forEach(el=>{
      const state=coverPickTree[el.dataset.parent];
      if(!state)return;
      const all=state.children.length>0 && state.selected.length===state.children.length;
      const partial=state.selected.length>0 && !all;
      // Parent-only mode remains checked; partial child selection uses native indeterminate.
      el.checked=!!state.parentSelected;
      el.indeterminate=false;
    });
    const filter=document.getElementById('cover-filter');
    if(filter && !filter.querySelector('[value="selected"]')){filter.options[0].text='All covers';filter.add(new Option('Selected covers','selected'));}
    const hubTitle = document.getElementById('covers-hub-title');
    const hubSub = document.querySelector('#covers-hub .card-subtitle');
    if (hubTitle) hubTitle.textContent = `Select covers (${defaultCoversCatalogForProduct().length})`;
    if (hubSub) hubSub.textContent = 'Choose covers from the standard catalogue — covers start unselected';
    if (footer) footer.innerHTML = `<span>Select covers to add to this product</span>`;
    return;
  }

  if (!pageRows.length) {
    wrap.innerHTML = `<div class="cs-empty">No covers match this search or filter.</div>`;
  } else if (coverView === 'grid') {
    wrap.innerHTML = `<div class="cs-grid">${pageRows.map((c, i) => {
      const idx = COVERS.indexOf(c);
      return `
      <div class="cs-grid-card" onclick="openCoverEditor('${c.id}')">
        <div class="cs-name-cell" style="margin-bottom:10px">
          <span class="cs-cover-icon" style="${coverIconStyle(c, idx)}">${coverInitials(c.name)}</span>
          <div>
            <div>${c.name}</div>
            <div class="text-mono" style="font-size:12px;color:var(--color-muted)">${c.code || c.id}</div>
          </div>
        </div>
        <div class="cs-product" style="margin-bottom:8px"><span>${productName || productId}</span><small>${productId}</small></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span class="cs-type">${coverTypeLabel(c)}</span>
          <span class="cs-pill ${coverIsMandatory(c) ? 'cs-pill-mandatory' : 'cs-pill-optional'}">${coverIsMandatory(c) ? 'Mandatory' : 'Optional'}</span>
        </div>
      </div>`;
    }).join('')}</div>`;
  } else {

/* ────────────────────────────────────────────────────────
   SEQUENTIAL COVER NAVIGATION
──────────────────────────────────────────────────────── */

function coverEditorOrder() {
  return sortedCoversForSidebar();
}

function adjacentCoverId(direction) {
  const ordered = coverEditorOrder();
  const currentIndex = ordered.findIndex(c => c.id === activeCoverId);
  if (currentIndex < 0) return '';
  const nextIndex = currentIndex + direction;
  return ordered[nextIndex]?.id || '';
}

function switchCover(id) {
  if (!id || id === activeCoverId) {
    if (id) loadCover(id);
    return true;
  }

  // If the current cover is incomplete, force the user to finish it before
  // moving away. This prevents accidental loss of an invalid configuration.
  if (activeCoverId) {
    const current = currentCover();
    if (current && !current.complete) {
      const saved = saveCover(null, { silent: true });
      if (!saved) return false;
    }
  }

  loadCover(id);
  return true;
}

function saveCoverAndNext(event) {
  if (event) event.preventDefault();

  const saved = saveCover(event, { silent: true });
  if (!saved) return false;

  const nextId = adjacentCoverId(1);
  if (nextId) {
    const savedName = currentCover()?.name || 'Cover';
    loadCover(nextId);
    PS.actionResult?.(
      'success',
      'Cover saved',
      `"${savedName}" is complete. Now configuring "${currentCover()?.name || 'next cover'}".`
    );
  } else {
    PS.actionResult?.(
      'success',
      'All covers configured',
      'This is the last cover in the current cover sequence.'
    );
  }

  return true;
}

function goToPreviousCover(event) {
  if (event) event.preventDefault();

  const previousId = adjacentCoverId(-1);
  if (!previousId) return false;

  if (activeCoverId) {
    const current = currentCover();
    if (current && !current.complete) {
      const saved = saveCover(null, { silent: true });
      if (!saved) return false;
    }
  }

  loadCover(previousId);
  return true;
}

function loadCover(id) {
  activeCoverId = id;
  document.querySelectorAll('.cover-item').forEach(el => el.classList.remove('active'));
  document.getElementById(`cover-item-${id}`)?.classList.add('active');

  const cover = COVERS.find(c => c.id === id);
  if (!cover) return;
  try {
    renderDetailPanel(normalizeCover(cover, COVERS.indexOf(cover)));
  } catch (err) {
    const panel = document.getElementById('detail-panel');
    if (panel) {
      panel.innerHTML = `<div class="section-card" style="padding:32px"><div style="font-weight:650;margin-bottom:8px">Could not open this cover</div><div style="color:var(--color-muted);font-size:13px">${String(err.message || err)}</div></div>`;
    }
  }
}

function toggleSection(id) {
  const body = document.getElementById(`sec-body-${id}`);
  const chev = document.getElementById(`sec-chev-${id}`);
  if (!body) return;
  const isOpen = body.classList.contains('open');
  if (isOpen) { body.classList.remove('open'); chev?.classList.remove('open'); openSections.delete(id); }
  else         { body.classList.add('open');    chev?.classList.add('open');    openSections.add(id); }
}

function nextCoverCode(name, type) {
  const token = String(type || name || 'COV').replace(/[^A-Za-z]/g, '').slice(0, 5).toUpperCase() || 'COV';
  const used = new Set((COVERS || []).map(c => String(c.code || '').toLowerCase()).filter(Boolean));
  let n = (COVERS || []).length + 1;
  let code = `COV-${token}-${String(n).padStart(3, '0')}`;
  while (used.has(code.toLowerCase())) {
    n += 1;
    code = `COV-${token}-${String(n).padStart(3, '0')}`;
  }
  return code;
}

function fieldRow(label, value, mono=false, type='text', opts=[], readonly=false) {
  if (readonly) {
    if (type === 'text') {
      const monoStyle = mono ? "font-family:'IBM Plex Mono',monospace;" : '';
      const dataAttr = label === 'Cover Name' ? ' data-cover-name="1"' : label === 'Cover Type' ? ' data-cover-type="1"' : '';
      return `<div class="form-group"><label class="form-label">${label}</label>
        <input type="text" class="form-control cs-readonly-field" value="${value||''}" readonly tabindex="-1"${dataAttr} style="${monoStyle || 'background:var(--color-surface);cursor:default;'}">
      </div>`;
    }
    return `<div class="form-group"><label class="form-label">${label}</label>
      <div class="field-value${mono?' mono':''}" style="font-size:14px;padding:6px 0">${value||'—'}</div>
    </div>`;
  }
  if (type === 'select') {
    const selectKey = ({
      'Loss Basis': 'lossBasis',
      'Reinstatement': 'reinstatement',
      'Benefit Basis': 'benefitBasis'
    })[label] || '';
    const change = selectKey ? ` onchange="patchCoverField('${selectKey}', this.value); persistAndRefreshCover()"` : '';
    return `<div class="form-group"><label class="form-label">${label}</label>
      <select class="form-control"${change}>${opts.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select>
    </div>`;
  }
  return `<div class="form-group"><label class="form-label">${label}</label>
    <input type="text" class="form-control" value="${value||''}" ${mono?'style="font-family:\'IBM Plex Mono\',monospace"':''} ${readonly?'readonly':''}>
  </div>`;
}

function formatFinancialSummary(c) {
  const items = Array.isArray(c.insuredItems) ? c.insuredItems : [];
  const first = items[0];
  const basis = vbMeta(first?.defaultBasis || c.basisOfCoverage);
  const limit = isServiceCover(c)
    ? `${first?.serviceUsageLimit || '—'} ${first?.serviceUsageUnit || 'call-outs per year'}`
    : ((first?.limitAmount || c.sumInsured) ? `$${first?.limitAmount || c.sumInsured}` : 'No limit');
  const aggregate = first?.itemAnnualAggregate
    ? `Aggregate ${first?.itemAggregateLimit ? '$' + first.itemAggregateLimit : 'configured'}`
    : 'No aggregate';
  const n = items.length ? `${items.length} item${items.length === 1 ? '' : 's'}` : 'No items';
  const ded = formatDeductibleSummary(c);
  return `${n} · ${limit} · ${aggregate} · ${ded} · ${basis.id}`;
}

function addCoverValidationError(field, message, invalidFields, fallbackFocus) {
  // Never let a missing DOM field bypass business validation.
  if (!field) {
    invalidFields.push({
      focus: typeof fallbackFocus === 'function' ? fallbackFocus : () => {}
    });
    return;
  }
  if (!invalidFields.includes(field)) invalidFields.push(field);
  field.classList.add('validation-error');

  const group = field.closest('.form-group');
  if (!group) return;
  if (group.querySelector('.validation-error-message')) return;

  const msg = document.createElement('div');
  msg.className = 'validation-error-message';
  msg.textContent = message;
  msg.style.cssText = 'color:#dc2626;font-size:12px;margin-top:5px;';
  group.appendChild(msg);
}

function coverNumeric(value) {
  const s = String(value ?? '').trim();
  if (!s) return null;
  if (!/^\d+(?:\.\d+)?$/.test(s)) return NaN;
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

function validateDeductibleConfiguration(cover, panel, invalidFields) {
  if (!cover || !panel) return;

  const type = String(cover.deductibleType || 'none').toLowerCase();
  if (type === 'none') return;

  if (type === 'fixed') {
    const field = panel.querySelector('[data-validation-field="deductibleAmount"]');
    const value = coverNumeric(cover.deductibleAmount);
    if (value == null || !Number.isFinite(value) || value < 0) {
      addCoverValidationError(field, 'Deductible Amount must be 0 or greater.', invalidFields);
    }
    return;
  }

  if (type === 'percentage') {
    const field = panel.querySelector('[data-validation-field="deductiblePct"]');
    const value = coverNumeric(cover.deductiblePct);
    if (value == null || !Number.isFinite(value)) {
      addCoverValidationError(field, 'Deductible Percentage is required when Percentage is selected.', invalidFields);
    } else if (value <= 0 || value > 100) {
      addCoverValidationError(field, 'Deductible Percentage must be between 0 and 100.', invalidFields);
    }
  }
}

function showCoverSaveNotice(type, message) {
  const panel = document.getElementById('detail-panel');
  if (!panel) return;

  const old = panel.querySelector('.cover-save-notice');
  if (old) old.remove();

  const saveBtn = panel.querySelector('[data-save-cover-btn]');
  const footer = saveBtn?.closest('div[style*="justify-content:space-between"]') || saveBtn?.parentElement?.parentElement;
  if (!footer) return;

  const notice = document.createElement('div');
  notice.className = 'cover-save-notice';
  notice.setAttribute('role', type === 'error' ? 'alert' : 'status');
  notice.style.cssText = `
    width:100%;
    box-sizing:border-box;
    margin-top:10px;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid ${type === 'error' ? '#FECACA' : '#BBF7D0'};
    background:${type === 'error' ? '#FEF2F2' : '#F0FDF4'};
    color:${type === 'error' ? '#B91C1C' : '#166534'};
    font-size:12px;
    line-height:17px;
    font-weight:600;
  `;
  notice.innerHTML = `${type === 'error' ? '✕' : '✓'} <span>${htmlEsc(message)}</span>`;

  footer.insertAdjacentElement('afterend', notice);
}

function saveCover(event, options = {}) {
  event?.preventDefault();
  const panel=document.getElementById('detail-panel'),cover=currentCover();
  if(!panel || !cover){PS.actionResult('error','Save failed','Cover form or cover could not be found.');return false;}
  panel.querySelectorAll('.validation-error').forEach(el=>el.classList.remove('validation-error'));
  panel.querySelectorAll('.validation-error-message').forEach(el=>el.remove());
  if(typeof snapshotControls==='function')snapshotControls(activeCoverId);
  const selectedDed=panel.querySelector('input[name="ded-'+cover.id+'"]:checked');
  if(selectedDed)cover.deductibleType=selectedDed.value;
  ['deductibleAmount','deductiblePct','deductiblePctOf','minDeductible','maxDeductible','copay'].forEach(key=>{
    const field=panel.querySelector('[data-validation-field="'+key+'"]');if(field)cover[key]=String(field.value ?? '').trim();
  });
  try {
    cover.coverVersion = coverVersionLabel();
    cover.complete = true;
    cover.status = 'complete';
    cover.lastUpdated = new Date().toLocaleDateString('en-GB', {
      day: '2-digit',
      month: 'short',
      year: 'numeric'
    });
    PS.prototypeApp?.persistCollection?.('covers', COVERS);
  } catch (err) {
    const message = err instanceof Error ? err.message : 'The cover could not be saved.';
    PS.actionResult?.('error', 'Save failed', message);
    showCoverSaveNotice('error', `Save failed: ${message}`);
    return false;
  }

  renderCoverList();

  if (!options.silent) {
    const successMessage = `"${cover.name || 'Cover'}" has been saved successfully.`;
    PS.actionResult(
      'success',
      'Cover saved',
      successMessage
    );
    showCoverSaveNotice('success', successMessage);
  }

  return true;
}

function syncLibraryCoverCodePreview() {
  const name = document.getElementById('lib-cover-name')?.value.trim() || '';
  const codeEl = document.getElementById('lib-cover-code');
  if (!codeEl || codeEl.dataset.userEdited === '1') return;
  const core = name.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toUpperCase().slice(0, 16) || 'NEW';
  codeEl.value = name ? `COV-${core}` : '';
}

function nextAddCoverCode(name, type) {
  const token = String(type || name).replace(/[^A-Za-z]/g, '').slice(0, 5).toUpperCase() || 'COV';
  const used = new Set((COVERS || []).map(c => String(c.code || '').toLowerCase()).filter(Boolean));
  let n = (COVERS || []).length + 1;
  let code = `${token}-${new Date().getFullYear()}-${String(n).padStart(3, '0')}`;
  while (used.has(code.toLowerCase())) {
    n += 1;
    code = `${token}-${new Date().getFullYear()}-${String(n).padStart(3, '0')}`;
  }
  return code;
}

function executeCreateLibraryCover() {
  const name = document.getElementById('lib-cover-name')?.value.trim();
  const type = document.getElementById('lib-cover-type')?.value.trim();
  const family = 'Trucking';
  if (!name) {
    PS.actionResult?.('error', 'Name required', 'Enter a cover name.');
    return;
  }
  const catalog = (window.PREDEFINED_COVER_LIBRARY || TRUCKING_DEFAULT_COVER_CATALOG).concat(PS.prototypeApp?.libraryExtrasFor?.('coverage') || []);
  if (catalog.some(c => String(c.name).toLowerCase() === name.toLowerCase())) {
    PS.actionResult?.('error', 'Already exists', `"${name}" is already in the cover catalogue.`);
    return;
  }
  const core = name.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '').toUpperCase().slice(0, 16) || 'NEW';
  let code = String(document.getElementById('lib-cover-code')?.value || '').trim();
  if (!code) code = `COV-${core}`;
  let n = 2;
  const used = new Set(catalog.map(c => String(c.code).toLowerCase()));
  while (used.has(code.toLowerCase())) code = `COV-${core}-${n++}`;
  PS.prototypeApp?.addLibraryExtra?.('coverage', { id: `LIB-${core}`, name, code, type, family });
  PS.closeModal();
  PS.actionResult?.('success', 'Cover created', `${name} is now in the predefined cover catalogue.`);
  renderCoverageLibraryDashboard();
}

function filterLibCoverRows(q) {
  const needle = String(q || '').trim().toLowerCase();
  document.querySelectorAll('#lib-cover-body tr').forEach(tr => {
    tr.hidden = Boolean(needle) && !(tr.getAttribute('data-search') || '').includes(needle);
  });
}
